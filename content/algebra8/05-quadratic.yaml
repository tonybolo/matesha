id: '05-quadratic'
order: 5
title: 'Квадратные уравнения'
summary: Уравнение x² = число, неполные уравнения, дискриминант как светофор, задача → уравнение.
passScore: 4

steps:
  - id: s1
    title: 'x² = число (на пальцах)'
    blocks:
      - type: text
        text: >-
          Уравнение $x^2=49$ спрашивает: «Какой стороны нужен квадрат площадью 49?» Ответ: 7. Но есть и второй ответ:
          $(-7)\cdot(-7)=49$ тоже! Поэтому корней **два**: $7$ и $-7$.
      - type: viz
        id: rug
      - type: example
        title: '$3x^2-147=0$'
        steps:
          - 'Переносим: $3x^2=147$.'
          - 'Делим на 3: $x^2=49$.'
          - '$x=7$ или $x=-7$.'
      - type: note
        kind: warn
        text: >-
          Если справа **отрицательное** число (например $x^2=-4$), корней нет: квадрат не бывает отрицательным.
          Если справа 0, корень один: $x=0$.

  - id: s2
    title: 'Неполные уравнения'
    blocks:
      - type: text
        text: >-
          Если нет свободного члена: $x^2-5x=0$, выносим $x$ за скобку. Произведение равно нулю, когда **хотя бы один множитель** равен нулю.
      - type: example
        title: '$x^2-5x=0$'
        steps:
          - '$x(x-5)=0$'
          - '$x=0$ или $x-5=0$'
          - '$x=0$ или $x=5$'
      - type: example
        title: '$2x^2+7x=0$'
        steps:
          - '$x(2x+7)=0$'
          - '$x=0$ или $2x=-7$, то есть $x=-3{,}5$.'

  - id: s3
    title: 'Парабола как мяч'
    blocks:
      - type: text
        text: >-
          График уравнения $ax^2+bx+c=0$ — парабола, как траектория брошенного мяча. Корни — это места, где мяч **касается земли** (ось $x$).
          Двигай числа $a, b, c$: сколько раз парабола коснётся земли?
      - type: viz
        id: parabola
      - type: note
        kind: tip
        text: 'Можно пересечь землю дважды (два корня), только коснуться (один корень) или вовсе не дойти до неё (корней нет).'

  - id: s4
    title: 'Дискриминант — светофор'
    blocks:
      - type: text
        text: >-
          Чтобы заранее знать, сколько корней, считаем число $D=b^2-4ac$. Это «светофор»:
      - type: example
        title: 'Светофор'
        reveal: false
        steps:
          - '$D>0$ — **зелёный**: два корня.'
          - '$D=0$ — **жёлтый**: один корень.'
          - '$D<0$ — **красный**: корней нет.'
      - type: math
        tex: 'x_{1,2}=\dfrac{-b\pm\sqrt{D}}{2a}'
      - type: example
        title: 'Из классной работы: $2x^2+3x-5=0$'
        steps:
          - '$a=2$, $b=3$, $c=-5$.'
          - '$D=3^2-4\cdot 2\cdot(-5)=9+40=49$, $\sqrt{49}=7$.'
          - '$x_1=\dfrac{-3+7}{4}=1$, $x_2=\dfrac{-3-7}{4}=-2{,}5$.'
      - type: example
        title: 'Сколько корней у $81x^2-36x+4=0$, не решая?'
        steps:
          - '$D=(-36)^2-4\cdot 81\cdot 4=1296-1296=0$.'
          - '$D=0$: корень один.'
      - type: example
        title: '$3x^2+22x+24=0$'
        steps:
          - '$D=22^2-4\cdot 3\cdot 24=484-288=196$, $\sqrt{D}=14$.'
          - '$x=\dfrac{-22\pm 14}{6}$: $x_1=-\dfrac{4}{3}$, $x_2=-6$.'

  - id: s5
    title: 'Сначала раскрой скобки'
    blocks:
      - type: text
        text: 'Если уравнение записано со скобками, сначала раскрой их, перенеси всё в одну сторону и приведи к виду $ax^2+bx+c=0$.'
      - type: example
        title: '$(x-2)^2=3x-8$'
        steps:
          - '$x^2-4x+4=3x-8$'
          - 'Переносим всё влево: $x^2-7x+12=0$.'
          - '$D=49-48=1$, $x=\dfrac{7\pm 1}{2}$: $x_1=3$, $x_2=4$.'
      - type: note
        kind: tip
        text: 'Проверка: подставь корень обратно в исходное уравнение. $(3-2)^2=1$ и $3\cdot 3-8=1$ ✓.'

  - id: s6
    title: 'Задача → уравнение'
    blocks:
      - type: text
        text: >-
          В задаче обозначь неизвестное буквой (обычно $x$), выразим через неё всё остальное, составим уравнение и решим.
          Подходят не все корни: смысл задачи может не разрешить, например, отрицательное число кустов.
      - type: example
        title: 'Фермер высадил 456 кустов малины в несколько рядов. В каждом ряду кустов на 5 меньше, чем рядов. Сколько кустов в ряду?'
        steps:
          - 'Пусть в ряду $x$ кустов. Тогда рядов $x+5$.'
          - 'Всего $x(x+5)=456$, то есть $x^2+5x-456=0$.'
          - '$D=25+1824=1849=43^2$, $x=\dfrac{-5\pm 43}{2}$: $x_1=19$, $x_2=-24$.'
          - 'Отрицательное число кустов не бывает. **Ответ: 19.**'
      - type: example
        title: 'Диагональ прямоугольника 26 см, одна сторона составляет $\dfrac{5}{12}$ другой. Найти периметр.'
        steps:
          - 'Пусть стороны $5k$ и $12k$. По теореме Пифагора $(5k)^2+(12k)^2=26^2$.'
          - '$169k^2=676$, $k^2=4$, $k=2$ (длина положительна).'
          - 'Стороны 10 см и 24 см, периметр $2(10+24)=68$ см.'

check:
  - id: q1
    kind: input
    step: 0
    prompt: 'Реши уравнение $x^2=49$. (Несколько значений через «;».)'
    answerKind: roots
    answer: '7; -7'
    explain: 'Два квадрата: $7^2=49$ и $(-7)^2=49$. Корни 7 и −7.'
  - id: q2
    kind: choice
    step: 3
    prompt: 'Сколько корней у уравнения $x^2+2x+5=0$? (Не решай, посчитай $D$.)'
    options:
      - 'Два'
      - 'Один'
      - 'Нет корней'
    correct: 2
    explain: '$D=2^2-4\cdot 1\cdot 5=4-20=-16<0$: красный свет, корней нет.'
  - id: q3
    kind: input
    step: 3
    prompt: 'Реши уравнение $2x^2+3x-5=0$.'
    answerKind: roots
    answer: '1; -5/2'
    explain: '$D=49$, $x=\dfrac{-3\pm 7}{4}$: $x_1=1$, $x_2=-2{,}5$.'
  - id: q4
    kind: input
    step: 1
    prompt: 'Реши уравнение $x^2-5x=0$.'
    answerKind: roots
    answer: '0; 5'
    explain: '$x(x-5)=0$: $x=0$ или $x=5$.'
  - id: q5
    kind: choice
    step: 5
    prompt: 'Сколько корней у уравнения $81x^2-36x+4=0$?'
    options:
      - 'Нет корней'
      - 'Один'
      - 'Два'
    correct: 1
    explain: '$D=1296-1296=0$: жёлтый свет, один корень.'

