id: '06-fraction-mult'
order: 3
title: 'Произведение и частное дробей'
summary: Умножаем и делим дроби «на пальцах», степень дроби, обратная пропорциональность y = k/x и её график.
passScore: 4

steps:
  - id: s1
    title: 'Умножаем дроби: площадь прямоугольника'
    blocks:
      - type: text
        text: >-
          Дробь $\dfrac{2}{3}$ — это 2 части из 3. Умножить две дроби — значит **взять часть от части**.
          Например, $\dfrac{2}{3}$ от $\dfrac{3}{4}$. Нарисуем квадрат площадью 1 и разрежем его на 3 столбца и 4 строки.
          Закрасим 2 столбца и 3 строки. Там, где закраски пересеклись, и получится ответ: считай клеточки.
      - type: viz
        id: areaMult
      - type: note
        kind: tip
        text: >-
          Правило: **числитель на числитель, знаменатель на знаменатель**:
          $\dfrac{a}{b}\cdot\dfrac{c}{d}=\dfrac{a\cdot c}{b\cdot d}$.
      - type: example
        title: '$\dfrac{2}{3}\cdot\dfrac{3}{4}$'
        steps:
          - 'Перемножаем: $\dfrac{2\cdot 3}{3\cdot 4}=\dfrac{6}{12}$.'
          - 'Сокращаем на 6: $\dfrac{1}{2}$. Столько же клеточек закрашено дважды на картинке.'

  - id: s2
    title: 'Сначала раскладываем и сокращаем'
    blocks:
      - type: text
        text: >-
          С буквами умножать всё подряд неудобно: получатся огромные выражения. Лучше **сначала разложить на множители**,
          а потом сократить одинаковые множители «крест-накрест».
      - type: example
        title: '$\dfrac{a^2+5a}{x^2}\cdot\dfrac{ax^6}{3a+15}$'
        steps:
          - 'Разложим на множители: $a^2+5a=a(a+5)$ и $3a+15=3(a+5)$.'
          - 'Получим $\dfrac{a(a+5)}{x^2}\cdot\dfrac{ax^6}{3(a+5)}$.'
          - 'Сократим $(a+5)$. У степеней с одним основанием показатели вычитаем: $x^6:x^2=x^4$.'
          - 'Остаётся $\dfrac{a\cdot a\cdot x^4}{3}=\dfrac{a^2x^4}{3}$.'
      - type: note
        kind: warn
        text: >-
          Сокращать можно только **множители**, а не слагаемые. В дроби $\dfrac{a+5}{a}$ ничего сократить нельзя, а вот
          в $\dfrac{a(a+5)}{a}$ можно: останется $a+5$.
      - type: note
        kind: tip
        text: >-
          Формулы сокращённого умножения тоже помогают сократить: $a^2-25=(a-5)(a+5)$.

  - id: s3
    title: 'Делим дроби: сколько поместится'
    blocks:
      - type: text
        text: >-
          Что значит $6:2$? Сколько двоек поместится в шестёрке: **3**. А $\dfrac{3}{4}:\dfrac{1}{4}$? Сколько четвертинок
          поместится в трёх четвертях: тоже **3**. Выбери числа и посмотри на полоску: делить — значит считать, сколько кусочков помещается.
      - type: viz
        id: divide
      - type: note
        kind: tip
        text: >-
          Поместится столько раз, сколько получится, если **умножить на перевёрнутую дробь**:
          $\dfrac{a}{b}:\dfrac{c}{d}=\dfrac{a}{b}\cdot\dfrac{d}{c}$.
      - type: example
        title: '$\dfrac{6a+15b}{a^9x}:\dfrac{8a+20b}{a^3x^6}$'
        steps:
          - 'Деление заменяем умножением на **перевёрнутую вторую** дробь: $\dfrac{6a+15b}{a^9x}\cdot\dfrac{a^3x^6}{8a+20b}$.'
          - 'Разложим: $6a+15b=3(2a+5b)$ и $8a+20b=4(2a+5b)$.'
          - 'Сократим $(2a+5b)$, сократим $a^3$ с $a^9$ (внизу остаётся $a^6$) и $x$ с $x^6$ (наверху остаётся $x^5$).'
          - 'Ответ: $\dfrac{3x^5}{4a^6}$.'
      - type: note
        kind: warn
        text: 'Переворачиваем именно **вторую** дробь (ту, на которую делим), а не первую.'

  - id: s4
    title: 'Степень дроби'
    blocks:
      - type: text
        text: >-
          Возвести дробь в степень — значит перемножить её саму на себя:
          $\left(\dfrac{2a}{3x}\right)^2=\dfrac{2a}{3x}\cdot\dfrac{2a}{3x}=\dfrac{4a^2}{9x^2}$.
          Возводим в степень **и числитель, и знаменатель**: $\left(\dfrac{a}{b}\right)^n=\dfrac{a^n}{b^n}$.
      - type: example
        title: '$\left(\dfrac{2a^3}{3x^2}\right)^2\cdot\dfrac{9x^5}{8a^4}$'
        steps:
          - '$\left(\dfrac{2a^3}{3x^2}\right)^2=\dfrac{4a^6}{9x^4}$. Степень в степени: показатели **умножаем**, $(a^3)^2=a^6$.'
          - 'Умножаем и сокращаем: $\dfrac{4a^6}{9x^4}\cdot\dfrac{9x^5}{8a^4}=\dfrac{a^2x}{2}$.'
      - type: note
        kind: tip
        text: >-
          Три правила для степеней с одним основанием: при умножении показатели **складываем** ($a^2\cdot a^3=a^5$),
          при делении **вычитаем** ($x^6:x^2=x^4$), при возведении степени в степень **умножаем** ($(a^3)^2=a^6$).

  - id: s5
    title: 'Обратная пропорциональность y = k/x'
    blocks:
      - type: text
        text: >-
          Если 2 землекопа копают яму 12 часов, то 4 землекопа выкопают её за 6 часов, а 6 землекопов — за 4 часа.
          Чем больше людей, тем меньше времени, а **произведение остаётся одним и тем же**: $2\cdot 12=4\cdot 6=6\cdot 4=24$.
          Такая зависимость называется **обратной пропорциональностью**: $y=\dfrac{k}{x}$, где $k=x\cdot y$ — то самое
          постоянное произведение.
      - type: viz
        id: hyperbola
        preset: k
      - type: text
        text: >-
          График — **гипербола** из двух веток. Если $k>0$, ветки в первой и третьей четвертях, если $k<0$ — во второй и
          четвёртой. Ветки никогда не касаются осей: $x\ne 0$ (на ноль делить нельзя), и $y$ тоже никогда не равен нулю.
      - type: example
        title: 'Задать формулой обратную пропорциональность, если график проходит через точку $M(-2;4)$'
        steps:
          - '$k=x\cdot y=(-2)\cdot 4=-8$.'
          - 'Формула: $y=-\dfrac{8}{x}$.'
          - 'Проверка: при $x=-2$ получаем $y=-\dfrac{8}{-2}=4$ ✓.'
      - type: note
        kind: warn
        text: >-
          Не путай с **прямой** пропорциональностью $y=kx$: её график — прямая через начало координат. Точка $M(-2;4)$ лежит и на
          прямой $y=-2x$, но это не обратная пропорциональность.

  - id: s6
    title: 'Решаем графически: гипербола и прямая'
    blocks:
      - type: text
        text: >-
          Чтобы решить уравнение $\dfrac{4}{x}=x-3$, нарисуй график левой части (гипербола) и график правой части (прямая).
          Корни — это **абсциссы** (значения $x$) точек пересечения. Двигай прямую и смотри, сколько получается точек.
      - type: viz
        id: hyperbola
        preset: line
      - type: example
        title: 'Решить графически $\dfrac{4}{x}=x-3$'
        steps:
          - 'График $y=\dfrac{4}{x}$ строим по точкам: $(1;4)$, $(2;2)$, $(4;1)$, $(-1;-4)$, $(-2;-2)$, $(-4;-1)$.'
          - 'График $y=x-3$ — прямая через точки $(0;-3)$, $(3;0)$, $(4;1)$.'
          - 'Графики пересекаются в точках $(4;1)$ и $(-1;-4)$. Корни — абсциссы: $x=4$ и $x=-1$.'
          - 'Проверка: $\dfrac{4}{4}=1=4-3$ ✓ и $\dfrac{4}{-1}=-4=-1-3$ ✓.'
      - type: note
        kind: tip
        text: >-
          Прямая может пересекать гиперболу в двух точках, **касаться** её (тогда корень один) или не иметь с ней общих точек
          (тогда корней нет).

  - id: s7
    title: 'Выразить переменную из формулы'
    blocks:
      - type: text
        text: >-
          Дана формула $\dfrac{2}{y}=\dfrac{3}{x}-\dfrac{4}{z}$, нужно выразить $x$ через $y$ и $z$. Идея: оставь дробь с $x$
          одну, всё остальное перенеси, приведи к общему знаменателю и **переверни** обе части.
      - type: example
        title: 'Выразить $x$ из $\dfrac{2}{y}=\dfrac{3}{x}-\dfrac{4}{z}$'
        steps:
          - 'Оставим дробь с $x$ слева: $\dfrac{3}{x}=\dfrac{2}{y}+\dfrac{4}{z}$.'
          - 'Правую часть приведём к общему знаменателю $yz$: $\dfrac{3}{x}=\dfrac{2z+4y}{yz}$.'
          - 'Дробь равна дроби — переворачиваем: $\dfrac{x}{3}=\dfrac{yz}{2z+4y}$, значит $x=\dfrac{3yz}{2z+4y}$.'
      - type: note
        kind: tip
        text: >-
          Проверка числами: пусть $y=1$, $z=2$. Тогда $x=\dfrac{3\cdot 1\cdot 2}{4+4}=\dfrac{3}{4}$, и
          $\dfrac{3}{x}-\dfrac{4}{z}=4-2=2=\dfrac{2}{y}$ ✓.

  - id: s8
    title: 'Длинное выражение: порядок действий'
    blocks:
      - type: text
        text: >-
          Длинное выражение разбираем по порядку: **скобки, потом умножение и деление слева направо**. В скобке нужен общий
          знаменатель, потом разложение на множители и сокращение. Часто «страшное» выражение в конце становится совсем коротким.
      - type: example
        title: '$\left(\dfrac{(a+2b)^2}{3(a-4b)}-3a\right)\cdot\dfrac{a^2-16b^2}{2a^2-10ab-b^2}:\dfrac{4a+16b}{27a-21}$ при $a=\dfrac{1}{3}$'
        steps:
          - 'Скобка: общий знаменатель $3(a-4b)$. Числитель $(a+2b)^2-9a(a-4b)=-8a^2+40ab+4b^2=-4(2a^2-10ab-b^2)$.'
          - 'Умножаем на $\dfrac{(a-4b)(a+4b)}{2a^2-10ab-b^2}$: сокращаем $(a-4b)$ и $(2a^2-10ab-b^2)$. Получаем $-\dfrac{4(a+4b)}{3}$.'
          - 'Делим на $\dfrac{4(a+4b)}{3(9a-7)}$, то есть умножаем на перевёрнутую: $-\dfrac{4(a+4b)}{3}\cdot\dfrac{3(9a-7)}{4(a+4b)}=-(9a-7)=7-9a$.'
          - 'Подставляем $a=\dfrac{1}{3}$: $7-9\cdot\dfrac{1}{3}=7-3=4$.'
      - type: note
        kind: tip
        text: 'Если в ответе должна «исчезнуть» буква ($b$ в этом примере), это хороший знак: значит, всё сократилось верно.'

check:
  - id: q1
    kind: choice
    step: 1
    prompt: 'Чему равно $\dfrac{2a}{3}\cdot\dfrac{9}{4a^2}$?'
    options:
      - '$\dfrac{3}{2a}$'
      - '$\dfrac{3a}{2}$'
      - '$\dfrac{3}{2a^2}$'
      - '$\dfrac{3}{8a}$'
    correct: 0
    explain: '$\dfrac{2a\cdot 9}{3\cdot 4a^2}=\dfrac{18a}{12a^2}=\dfrac{3}{2a}$: сократили 6 и одну букву $a$.'
  - id: q2
    kind: input
    step: 2
    prompt: 'Найди значение: $\dfrac{6x}{5}:\dfrac{3x}{10}$'
    answerKind: expr
    answer: '4'
    explain: 'Делить — значит умножать на перевёрнутую дробь: $\dfrac{6x}{5}\cdot\dfrac{10}{3x}=\dfrac{60x}{15x}=4$.'
  - id: q3
    kind: choice
    step: 4
    prompt: 'Какая формула задаёт обратную пропорциональность, если график проходит через точку $M(3;-6)$?'
    options:
      - '$y=\dfrac{18}{x}$'
      - '$y=-\dfrac{18}{x}$'
      - '$y=-2x$'
      - '$y=-\dfrac{2}{x}$'
    correct: 1
    explain: '$k=3\cdot(-6)=-18$, значит $y=-\dfrac{18}{x}$. Формула $y=-2x$ тоже проходит через точку, но это прямая пропорциональность.'
  - id: q4
    kind: input
    step: 5
    prompt: 'Реши уравнение $\dfrac{6}{x}=x+1$ (графически или как умеешь). Несколько значений через «;».'
    answerKind: roots
    answer: '2; -3'
    explain: 'Гипербола $y=\dfrac{6}{x}$ и прямая $y=x+1$ пересекаются в точках $(2;3)$ и $(-3;-2)$. Корни $2$ и $-3$.'
  - id: q5
    kind: choice
    step: 2
    prompt: 'Как разделить одну дробь на другую?'
    options:
      - 'Умножить первую дробь на перевёрнутую вторую'
      - 'Сложить числители и оставить знаменатель'
      - 'Перемножить числители и знаменатели, ничего не переворачивая'
      - 'Умножить вторую дробь на перевёрнутую первую'
    correct: 0
    explain: '$\dfrac{a}{b}:\dfrac{c}{d}=\dfrac{a}{b}\cdot\dfrac{d}{c}$. Переворачиваем ту дробь, на которую делим.'
  - id: q6
    kind: input
    step: 3
    prompt: 'Упрости: $\left(\dfrac{2x}{3}\right)^2:\dfrac{x}{9}$'
    answerKind: expr
    answer: '4*x'
    explain: '$\dfrac{4x^2}{9}\cdot\dfrac{9}{x}=4x$.'

