id: '00-rational-numbers'
order: 0
title: 'Сложение и вычитание рациональных чисел'
summary: >-
  Повторение: числа со знаками — целые, десятичные, обыкновенные дроби и смешанные числа. Модуль, сравнение,
  сложение «прыжками по прямой», вычитание как прибавление противоположного, минус перед скобкой.
passScore: 5

steps:
  - id: s1
    title: 'Числа бывают с минусом'
    blocks:
      - type: text
        text: >-
          Зимой градусник показывает $-10^\circ$ — это на 10 градусов **ниже нуля**, мороз. Летом $+25^\circ$ — на 25
          градусов выше нуля. Ноль — граница: при нуле вода замерзает.
      - type: text
        text: >-
          Вторая история — кошелёк. Если у тебя есть 50 рублей, твоё «богатство» равно $+50$. А если ты занял у друга
          30 рублей и ещё не вернул, у тебя **долг**: $-30$. Минус значит «не хватает до нуля».
      - type: text
        text: >-
          Положи градусник набок — получится **числовая прямая**. Ноль посередине, **справа** положительные числа
          (1, 2, 3 и дальше), **слева** отрицательные ($-1$, $-2$, $-3$ и дальше). Каждое число — точка на прямой.
          Выбери число и посмотри, где оно стоит.
      - type: viz
        id: opposites
        preset: line
      - type: note
        kind: tip
        text: >-
          Все числа, которые можно записать дробью $\dfrac{m}{n}$ ($m$ — целое, $n$ — натуральное), называются
          **рациональными**. Это целые числа ($-3=\dfrac{-3}{1}$, $0=\dfrac{0}{1}$), десятичные дроби
          ($-2{,}5=-\dfrac{5}{2}$) и обыкновенные дроби ($-\dfrac{3}{4}$).
      - type: note
        kind: tip
        text: 'Плюс у положительного числа можно не писать: $+5=5$. Ноль — ни положительный, ни отрицательный.'
      - type: example
        title: 'Где на прямой стоят числа $-4$, $2{,}5$ и $-\dfrac{1}{2}$?'
        steps:
          - '$-4$: от нуля 4 шага **влево**.'
          - '$2{,}5$: два с половиной шага **вправо**, ровно посередине между $2$ и $3$.'
          - '$-\dfrac{1}{2}$: полшага влево, посередине между $-1$ и $0$.'

  - id: s2
    title: 'Противоположные числа и модуль'
    blocks:
      - type: text
        text: >-
          Поставь в точку 0 зеркало. Отражение числа $3$ — число $-3$, отражение $-5$ — число $5$. Такие пары называют
          **противоположными числами**: они на одинаковом расстоянии от нуля, но по разные стороны. Число,
          противоположное $a$, пишут $-a$. Поэтому $-(-5)=5$: «противоположное к $-5$» — это $5$.
      - type: viz
        id: opposites
      - type: note
        kind: tip
        text: >-
          **Модуль** числа — это расстояние от нуля до этого числа: сколько шагов. Пишут палочками: $\left|-5\right|=5$, $|5|=5$,
          $|0|=0$. Расстояние не бывает отрицательным, поэтому и модуль никогда не бывает отрицательным.
      - type: text
        text: >-
          **Сравнение.** На прямой **правее — больше**. Значит, любое положительное число больше нуля, а ноль больше
          любого отрицательного. Из двух отрицательных больше то, что ближе к нулю: $-2>-5$. Как с морозом: $-2^\circ$
          теплее, чем $-5^\circ$.
      - type: viz
        id: opposites
        preset: compare
      - type: note
        kind: warn
        text: >-
          Не путай: модуль у $-5$ больше, чем у $-2$, а само число $-5$ **меньше**. Долг 5 рублей хуже, чем долг
          2 рубля.
      - type: example
        title: 'Сравни $-0{,}7$ и $-\dfrac{3}{4}$'
        steps:
          - 'Запишем дробь десятичной: $\dfrac{3}{4}=0{,}75$.'
          - 'Модули: $0{,}70<0{,}75$. У $-0{,}7$ модуль меньше — оно ближе к нулю и правее.'
          - 'Значит, $-0{,}7>-\dfrac{3}{4}$.'

  - id: s3
    title: 'Сложение: прыжки по прямой'
    blocks:
      - type: text
        text: >-
          Сложение — это прыжки по прямой. Первое число — где ты стоишь. Второе — прыжок: если оно
          **положительное**, прыгаешь **вправо**, если **отрицательное** — **влево**. Где приземлился — это и есть
          сумма. Меняй числа и смотри, куда попадёшь, а рядом — что стало бы с кошельком.
      - type: viz
        id: jumps
      - type: note
        kind: tip
        text: >-
          **Знаки одинаковые** — складываем модули, знак оставляем общий. Долг плюс долг — больший долг:
          $-4+(-3)=-7$.
      - type: note
        kind: tip
        text: >-
          **Знаки разные** — из большего модуля вычитаем меньший и ставим знак того числа, у которого модуль больше.
          Заработал 5 рублей, а потратил 8 — остался должен 3: $5+(-8)=-3$. Ведь $8-5=3$, а модуль больше у $-8$,
          значит, минус.
      - type: text
        text: >-
          Сумма противоположных чисел равна нулю: $-7+7=0$. Сколько взял в долг, столько и вернул — ты снова на нуле.
      - type: example
        title: '$-47+29$'
        steps:
          - 'Знаки разные. Модули: $47$ и $29$.'
          - 'Из большего вычитаем меньший: $47-29=18$.'
          - 'Модуль больше у $-47$, значит, у ответа минус: $-47+29=-18$.'
      - type: example
        title: '$-36+(-58)$'
        steps:
          - 'Знаки одинаковые: оба числа отрицательные.'
          - 'Складываем модули: $36+58=94$.'
          - 'Знак общий — минус: $-36+(-58)=-94$.'
      - type: note
        kind: warn
        text: 'Частая ошибка: $-5+3=-8$. Нет! От $-5$ прыгаем на 3 шага **вправо** и попадаем в $-2$.'

  - id: s4
    title: 'Вычитание — это прибавление противоположного'
    blocks:
      - type: text
        text: >-
          Что значит **вычесть долг**? Представь, что друг сказал: «Те 5 рублей можешь не возвращать». Долг у тебя
          забрали — и тебе стало **на 5 рублей лучше**, как будто подарили 5 рублей. Значит, вычесть $-5$ — то же
          самое, что прибавить $5$.
      - type: note
        kind: tip
        text: >-
          Правило: $a-b=a+(-b)$. Вычитание заменяем сложением с **противоположным** числом: $3-8=3+(-8)=-5$ и
          $3-(-8)=3+8=11$.
      - type: viz
        id: jumps
        preset: sub
      - type: example
        title: '$-6-(-14)$'
        steps:
          - 'Заменяем вычитание сложением с противоположным: $-6-(-14)=-6+14$.'
          - 'Знаки разные: $14-6=8$, модуль больше у $14$, знак плюс.'
          - 'Ответ: $8$.'
      - type: example
        title: '$-15-9$'
        steps:
          - '$-15-9=-15+(-9)$.'
          - 'Знаки одинаковые: $15+9=24$, знак минус.'
          - 'Ответ: $-24$.'
      - type: text
        text: >-
          **Пропущенное число.** В равенстве $-4+\boxed{?}=-9$ спрятано слагаемое. Неизвестное слагаемое находим так:
          из суммы вычитаем известное слагаемое: $-9-(-4)=-9+4=-5$. Проверка: $-4+(-5)=-9$ ✓.
      - type: note
        kind: tip
        text: >-
          Неизвестное уменьшаемое: к разности прибавь вычитаемое ($\boxed{?}-7=-3$, в окошке $-3+7=4$). Неизвестное
          вычитаемое: из уменьшаемого вычти разность ($2-\boxed{?}=9$, в окошке $2-9=-7$).
      - type: note
        kind: warn
        text: 'Два минуса рядом не «усиливают» минус, а дают плюс: $5-(-8)=5+8=13$.'

  - id: s5
    title: 'Десятичные дроби'
    blocks:
      - type: text
        text: >-
          С десятичными дробями всё то же самое: знак ставим по тем же правилам, а модули складываем или вычитаем
          **столбиком**. Главное — **запятая под запятой**. Если знаков после запятой разное количество, допиши нули:
          $1{,}2=1{,}20$.
      - type: example
        title: '$-3{,}7+1{,}25$'
        steps:
          - 'Знаки разные. Модули: $3{,}70$ и $1{,}25$ (дописали ноль).'
          - 'Из большего вычитаем меньший: $3{,}70-1{,}25=2{,}45$.'
          - 'Модуль больше у $-3{,}7$, поэтому минус: $-3{,}7+1{,}25=-2{,}45$.'
      - type: example
        title: '$-0{,}8-0{,}35$'
        steps:
          - 'Заменяем вычитание сложением: $-0{,}8+(-0{,}35)$.'
          - 'Знаки одинаковые: $0{,}80+0{,}35=1{,}15$.'
          - 'Знак общий — минус: $-0{,}8-0{,}35=-1{,}15$.'
      - type: note
        kind: warn
        text: >-
          Целое число тоже можно записать с запятой: $7=7{,}00$. В примере $-7+2{,}35$ подписываем $2{,}35$ под
          $7{,}00$: $7{,}00-2{,}35=4{,}65$, ответ $-4{,}65$.
      - type: note
        kind: tip
        text: >-
          Подвох с длиной: $4{,}3$ больше, чем $4{,}25$, ведь $4{,}3=4{,}30$. Поэтому $-4{,}25+4{,}3=0{,}05$ —
          положительное число.

  - id: s6
    title: 'Обыкновенные дроби и смешанные числа'
    blocks:
      - type: text
        text: >-
          Пиццу разрезали на 6 кусков, у тебя 5 из них — $\dfrac{5}{6}$ пиццы. А другу ты должен $\dfrac{3}{4}$ пиццы.
          Сколько останется, если отдать долг? Сразу сложить $\dfrac{5}{6}$ и $-\dfrac{3}{4}$ нельзя: куски разного
          размера. Нарежем обе пиццы на одинаковые куски — двенадцатые: $\dfrac{5}{6}=\dfrac{10}{12}$,
          $\dfrac{3}{4}=\dfrac{9}{12}$.
      - type: note
        kind: tip
        text: >-
          Сначала **общий знаменатель**, потом складываем числители по правилам знаков:
          $\dfrac{5}{6}+\left(-\dfrac{3}{4}\right)=\dfrac{10}{12}+\left(-\dfrac{9}{12}\right)=\dfrac{1}{12}$.
          Останется двенадцатая часть пиццы. Ответ сокращаем, если можно.
      - type: text
        text: 'Минус у дроби можно писать перед дробью или в числителе: $-\dfrac{3}{4}=\dfrac{-3}{4}$.'
      - type: text
        text: >-
          **Смешанное число** — целое и дробь вместе: $2\dfrac{1}{3}=2+\dfrac{1}{3}=\dfrac{7}{3}$. Минус относится
          ко **всему** числу: $-2\dfrac{1}{3}=-\left(2+\dfrac{1}{3}\right)=-\dfrac{7}{3}$.
      - type: note
        kind: warn
        text: >-
          $-2\dfrac{1}{3}$ — это **не** $-2+\dfrac{1}{3}$! Это долг: две целые пиццы и ещё треть. Поэтому
          $-2\dfrac{1}{3}+2=-\dfrac{1}{3}$, а не $\dfrac{1}{3}$.
      - type: example
        title: '$-1\dfrac{1}{2}+2\dfrac{1}{3}$'
        steps:
          - 'Переводим в неправильные дроби: $-\dfrac{3}{2}+\dfrac{7}{3}$.'
          - 'Общий знаменатель 6: $-\dfrac{9}{6}+\dfrac{14}{6}$.'
          - 'Знаки разные: $14-9=5$, модуль больше у $\dfrac{14}{6}$, знак плюс: $\dfrac{5}{6}$.'
      - type: example
        title: '$\dfrac{1}{3}-0{,}5$ — дробь и десятичная вперемешку'
        steps:
          - >-
            Дробь $\dfrac{1}{3}$ не записывается конечной десятичной дробью (тройки после запятой идут без конца),
            поэтому переводим $0{,}5$ в обыкновенную: $0{,}5=\dfrac{1}{2}$.
          - '$\dfrac{1}{3}-\dfrac{1}{2}=\dfrac{2}{6}-\dfrac{3}{6}=-\dfrac{1}{6}$.'
      - type: note
        kind: tip
        text: >-
          В тренажёре дробь пиши через «/»: $-\dfrac{7}{3}$ — это -7/3. Смешанное число записывай неправильной дробью.
          Дроби с буквами складываются и вычитаются по тем же правилам — это будет в теме 2 «Сложение и вычитание
          рациональных дробей».

  - id: s7
    title: 'Цепочки и скобки'
    blocks:
      - type: text
        text: >-
          Длинную цепочку считаем **слева направо**, а скобки — первыми. Но есть хитрость: любое вычитание можно
          заменить сложением, а слагаемые в сумме можно **переставлять** как удобно.
      - type: note
        kind: tip
        text: >-
          Удобный способ: сложи отдельно все положительные числа (деньги) и отдельно все отрицательные (долги), а потом
          сложи два ответа. Пример $-7+12-8+5$: положительные $12+5=17$, отрицательные $-7-8=-15$, вместе
          $17+(-15)=2$.
      - type: text
        text: >-
          **Минус перед скобкой** меняет знак у **каждого** слагаемого внутри: $-(5-8)=-5+8$. Это как отменить всю
          скобку целиком. Плюс перед скобкой ничего не меняет: $+(5-8)=5-8$.
      - type: math
        tex: '-(a+b)=-a-b,\qquad -(a-b)=-a+b'
      - type: example
        title: '$-12-(5-8)+4$'
        steps:
          - 'Раскрываем скобку, минус меняет знаки внутри: $-12-(5-8)+4=-12-5+8+4$.'
          - 'Положительные: $8+4=12$. Отрицательные: $-12-5=-17$.'
          - '$12+(-17)=-5$.'
          - 'Проверка по порядку: $5-8=-3$, потом $-12-(-3)=-9$ и $-9+4=-5$ ✓.'
      - type: note
        kind: warn
        text: >-
          Минус меняет знак у **всех** слагаемых в скобке, а не только у первого: $-(7-2)=-7+2$, а не $-7-2$.

  - id: s8
    title: '⭐ Модуль разности — расстояние между точками'
    blocks:
      - type: text
        text: >-
          Сколько шагов от точки $-2$ до точки $3$? Посчитай по прямой: 5. А $3-(-2)=5$. Если вычесть в «неудобном»
          порядке, получится $-2-3=-5$ — минус лишний. Его убирает модуль: $\left|-2-3\right|=\left|-5\right|=5$.
      - type: viz
        id: opposites
        preset: distance
      - type: note
        kind: tip
        text: '**Расстояние между точками $a$ и $b$ равно $|a-b|$.** Порядок не важен: $|a-b|=|b-a|$.'
      - type: text
        text: >-
          Теперь загадки с модулем читаются как задачи про расстояния. $|x-3|=5$ — «точки на расстоянии 5 от тройки».
          Их две: $3+5=8$ и $3-5=-2$. А $|x+4|$ — это $|x-(-4)|$, расстояние до точки $-4$.
      - type: note
        kind: tip
        text: >-
          $|x-3|<5$ — точки, которые **ближе** 5 шагов к тройке: все числа между $-2$ и $8$. Целых среди них девять:
          от $-1$ до $7$.
      - type: example
        title: 'Наименьшее значение $|x-2|+|x+3|$'
        steps:
          - '$|x-2|$ — расстояние от $x$ до $2$, а $|x+3|$ — расстояние от $x$ до $-3$.'
          - 'Если $x$ стоит между $-3$ и $2$, сумма двух расстояний равна длине отрезка: $2-(-3)=5$.'
          - 'Если $x$ снаружи отрезка, путь длиннее. Наименьшее значение — $5$.'

check:
  - id: q1
    kind: choice
    step: 1
    prompt: 'Какое из чисел самое большое?'
    options: ['$-7$', '$-0{,}5$', '$-\dfrac{3}{4}$', '$-2$']
    correct: 1
    explain: >-
      Правее всех на прямой $-0{,}5$: оно ближе всего к нулю. $-\dfrac{3}{4}=-0{,}75$ — левее, а $-2$ и $-7$ ещё
      левее.
  - id: q2
    kind: input
    step: 2
    prompt: 'Вычисли: $-8+3$'
    answerKind: expr
    answer: '-5'
    explain: 'Знаки разные: $8-3=5$, модуль больше у $-8$, значит, минус: $-8+3=-5$. На прямой: от $-8$ три шага вправо.'
  - id: q3
    kind: choice
    step: 3
    prompt: 'Как правильно заменить вычитание сложением: $7-(-2)$?'
    options: ['$7+2$', '$7+(-2)$', '$-7+2$', '$-7-2$']
    correct: 0
    explain: 'Вычитание — это прибавление противоположного числа. Противоположное к $-2$ — это $2$: $7-(-2)=7+2=9$.'
  - id: q4
    kind: input
    step: 4
    prompt: 'Вычисли: $-2{,}5+0{,}75$. Ответ запиши десятичной дробью.'
    answerKind: expr
    answer: '-1.75'
    placeholder: 'например: -0,5'
    explain: 'Знаки разные: $2{,}50-0{,}75=1{,}75$, модуль больше у $-2{,}5$, значит, минус: $-1{,}75$.'
  - id: q5
    kind: input
    step: 5
    prompt: 'Вычисли: $-\dfrac{2}{3}+\dfrac{1}{4}$. Ответ запиши дробью через «/».'
    answerKind: expr
    answer: '-5/12'
    reduce: true
    placeholder: 'например: 2/3'
    explain: 'Общий знаменатель 12: $-\dfrac{8}{12}+\dfrac{3}{12}=\dfrac{-8+3}{12}=-\dfrac{5}{12}$.'
  - id: q6
    kind: choice
    step: 5
    prompt: 'Чему равно $-2\dfrac{1}{3}$?'
    options: ['$-\dfrac{7}{3}$', '$-\dfrac{5}{3}$', '$\dfrac{7}{3}$', '$-\dfrac{2}{3}$']
    correct: 0
    explain: >-
      Минус относится ко всему смешанному числу: $-2\dfrac{1}{3}=-\left(2+\dfrac{1}{3}\right)=-\dfrac{7}{3}$.
      Ответ $-\dfrac{5}{3}$ получится, если по ошибке посчитать $-2+\dfrac{1}{3}$.
  - id: q7
    kind: input
    step: 6
    prompt: 'Вычисли: $-(4-9)-7$'
    answerKind: expr
    answer: '-2'
    explain: 'Минус перед скобкой меняет знаки: $-(4-9)=-4+9=5$. Потом $5-7=-2$.'

