id: '03-roots-compare'
order: 3
title: 'Корни и сравнение чисел'
summary: Корень «на пальцах», иррациональные числа, сравнение чисел с корнями, когда корень существует, график y = √x.
passScore: 5

steps:
  - id: s1
    title: 'Что такое корень (на пальцах)'
    blocks:
      - type: text
        text: >-
          Представь квадратный коврик из плиток. Если плиток на коврике **25**, сколько плиток в одной
          стороне? Правильно, **5**. Это число называют **корнем** из 25 и пишут $\sqrt{25}=5$.
      - type: text
        text: >-
          Корень отвечает на вопрос: **«Какой стороны нужен квадрат с такой площадью?»**
          Двигай ползунок: площадь меняется, а сторона рисуется в масштабе.
      - type: viz
        id: rug
      - type: note
        kind: tip
        text: >-
          Корень — «обратное действие» к квадрату: $5^2=25$, поэтому $\sqrt{25}=5$.
          Корень никогда не бывает отрицательным: длина стороны не бывает меньше нуля.

  - id: s2
    title: 'Числа, которые не укладываются ровно'
    blocks:
      - type: text
        text: >-
          Попробуй площадь **50** или **72**: сторона получается между двумя целыми числами. Точно её не записать ни целым
          числом, ни обыкновенной дробью, а в десятичной записи цифры никогда не кончаются и не повторяются.
          Такие числа называют **иррациональными**: $\sqrt{50}$, $\sqrt{72}$, $\sqrt{490}$.
      - type: note
        kind: tip
        text: >-
          Как отличить? Если число под корнем — точный квадрат ($1, 4, 9, 16, 25, 36, \dots$), корень целый.
          Если нет — корень иррациональный. Целые и дробные числа вместе называют **рациональными**.
      - type: example
        title: 'Десятичные: сдвигаем запятую'
        steps:
          - '$\sqrt{0{,}49}=0{,}7$, потому что $0{,}7\cdot 0{,}7=0{,}49$.'
          - 'Каждые **два** знака после запятой под корнем — **один** знак в ответе: $\sqrt{0{,}0049}=0{,}07$.'
          - 'Каждые **два** нуля в конце целого числа — **один** нуль в ответе: $\sqrt{4900}=70$.'
      - type: example
        title: 'Какое число иррациональное?'
        steps:
          - '$\sqrt{4900}=70$ — целое.'
          - '$\sqrt{0{,}0049}=0{,}07$ — рациональное.'
          - '$\sqrt{0{,}49}=0{,}7$ — рациональное.'
          - '$\sqrt{490}$: 490 — не точный квадрат ($22^2=484$, $23^2=529$), значит число **иррациональное**.'

  - id: s3
    title: 'Что больше? Сравниваем коврики'
    blocks:
      - type: text
        text: >-
          Два ковра: у какого площадь больше, у того и сторона длиннее. Поэтому, чтобы сравнить $\sqrt{a}$ и $\sqrt{b}$,
          достаточно сравнить $a$ и $b$: **больше подкоренное число — больше корень**.
      - type: example
        title: 'Сравнить $\sqrt{51}$ и $7$'
        steps:
          - 'Запишем 7 тоже корнем: $7=\sqrt{49}$ (потому что $7\cdot 7=49$).'
          - 'Теперь сравниваем $\sqrt{51}$ и $\sqrt{49}$: $51>49$.'
          - 'Значит $\sqrt{51}>7$.'
      - type: example
        title: 'Расставить по возрастанию $\sqrt{51},\ 7,\ \sqrt{\tfrac{101}{2}}$'
        steps:
          - 'Превращаем всё в корни: $7=\sqrt{49}$, $\sqrt{\tfrac{101}{2}}=\sqrt{50{,}5}$, $\sqrt{51}$.'
          - 'Сравниваем подкоренные: $49<50{,}5<51$.'
          - 'Порядок: $7<\sqrt{\tfrac{101}{2}}<\sqrt{51}$.'
      - type: note
        kind: warn
        text: 'Сравнивать нужно числа, записанные одинаково: оба под корнем (или оба без корня).'

  - id: s4
    title: 'Число перед корнем: «склеим» коврики'
    blocks:
      - type: text
        text: >-
          Как сравнить $5\sqrt{3}$ и $4\sqrt{5}$? Число $5\sqrt{3}$ — это «5 сторон по $\sqrt{3}$». Построим из ковриков **большой квадрат**
          со стороной $5\sqrt{3}$: в нём $5\times 5=25$ маленьких ковриков, у каждого площадь 3. Получилась площадь $25\cdot 3=75$.
      - type: viz
        id: bringIn
      - type: text
        text: 'Так же для $4\sqrt{5}$: $4\times 4=16$ ковриков по 5, площадь $16\cdot 5=80$. Площади сравниваем: $75<80$, значит $5\sqrt{3}<4\sqrt{5}$.'
      - type: math
        tex: 'a\sqrt{b}=\sqrt{a^2\cdot b}'
      - type: example
        title: 'Как в тетради'
        steps:
          - '$5\sqrt{3}\ \vee\ 4\sqrt{5}$'
          - '$5^2=5\cdot 5=25$, $4^2=4\cdot 4=16$.'
          - '$\sqrt{25\cdot 3}\ \vee\ \sqrt{16\cdot 5}$, то есть $\sqrt{75}\ \vee\ \sqrt{80}$.'
          - '$75<80$, значит $5\sqrt{3}<4\sqrt{5}$.'

  - id: s5
    title: 'Отрицательные числа'
    blocks:
      - type: text
        text: 'Отрицательное число всегда меньше положительного: $-3\sqrt{3}<5\sqrt{2}$, считать ничего не нужно.'
      - type: text
        text: >-
          А два отрицательных числа сравнивают «наоборот»: больше то, у которого **модуль меньше**.
          Например, $-\sqrt{7}$ и $-\sqrt{10}$: $\sqrt{7}<\sqrt{10}$, значит $-\sqrt{7}>-\sqrt{10}$.
      - type: note
        kind: tip
        text: 'Холодно −10° или −7°? Теплее −7°, а число 7 меньше десяти. Минус всё переворачивает.'

  - id: s6
    title: 'Когда корень существует'
    blocks:
      - type: text
        text: >-
          У коврика не бывает отрицательной площади. Поэтому **под корнем не может стоять отрицательное число**:
          $\sqrt{-4}$ не существует. Под корнем должно быть число, **большее нуля или равное нулю**.
      - type: viz
        id: domain
      - type: example
        title: 'При каких $x$ имеет смысл $\sqrt{-16x}$?'
        steps:
          - 'Нужно, чтобы под корнем не было отрицательного числа: $-16x\ge 0$.'
          - 'Число $-16$ отрицательное. Произведение отрицательного числа на $x$ неотрицательно, только если $x$ отрицательный или равен нулю.'
          - 'Ответ: $x\le 0$. Проверка: $x=-1$ даёт $-16\cdot(-1)=16\ge 0$ ✓, а $x=2$ даёт $-32<0$ ✗.'
      - type: example
        title: 'При каких $x$ имеет смысл $\sqrt{x-5}$?'
        steps:
          - '$x-5\ge 0$, значит $x\ge 5$.'
      - type: note
        kind: warn
        text: >-
          Если корень стоит в **знаменателе**, ноль тоже нельзя (делить на ноль нельзя): $\dfrac{1}{\sqrt{x}}$ имеет смысл только при $x>0$.

  - id: s7
    title: 'Функция y = √x и её график'
    blocks:
      - type: text
        text: >-
          Функция $y=\sqrt{x}$ каждому $x\ge 0$ ставит в соответствие сторону квадрата площадью $x$. Точки графика:
          $(0;0)$, $(1;1)$, $(4;2)$, $(9;3)$, $(16;4)$. Получается «половина параболы» — плавная линия вправо и вверх.
      - type: example
        title: 'При каком $x$ значение функции $y=\sqrt{x}$ равно $4$?'
        steps:
          - 'Нужно $\sqrt{x}=4$.'
          - 'Возводим в квадрат: $x=4^2=16$.'
          - 'Ответ **16**, а не «$\pm 16$»: аргумент $x$ у корня не бывает отрицательным.'
      - type: text
        text: 'Уравнение можно решить графически: нарисуй оба графика, корни — это абсциссы (значения $x$) точек пересечения. Двигай $k$ и $b$:'
      - type: viz
        id: sqrtGraph
      - type: example
        title: 'Решить графически $\sqrt{x}=4-\dfrac{x}{2}$'
        steps:
          - 'График $y=\sqrt{x}$ строим по точкам $(0;0)$, $(1;1)$, $(4;2)$, $(9;3)$.'
          - 'График $y=4-\dfrac{x}{2}$ — прямая через точки $(0;4)$, $(2;3)$, $(4;2)$.'
          - 'Графики пересекаются в точке $(4;2)$. Абсцисса этой точки — корень: $x=4$.'
          - 'Проверка: $\sqrt{4}=2$ и $4-\dfrac{4}{2}=2$ ✓.'

check:
  - id: q1
    kind: choice
    step: 1
    prompt: 'Какое из чисел **иррациональное**?'
    options:
      - '$\sqrt{4900}$'
      - '$\sqrt{0{,}0049}$'
      - '$\sqrt{490}$'
      - '$\sqrt{0{,}49}$'
    correct: 2
    explain: '4900 = 70², 0,0049 = 0,07², 0,49 = 0,7². А 490 — не точный квадрат, значит $\sqrt{490}$ иррациональное.'
  - id: q2
    kind: input
    step: 1
    prompt: 'Чему равен $\sqrt{0{,}0049}$? (Запиши десятичной дробью.)'
    answerKind: expr
    answer: '0.07'
    explain: 'Сдвигаем запятую: $0{,}07\cdot 0{,}07=0{,}0049$, значит $\sqrt{0{,}0049}=0{,}07$.'
  - id: q3
    kind: choice
    step: 2
    prompt: 'Что больше: $\sqrt{51}$ или $7$?'
    options:
      - '$\sqrt{51}$ больше'
      - '$7$ больше'
      - 'Они равны'
    correct: 0
    explain: '$7=\sqrt{49}$, а $51>49$. Чем больше число под корнем, тем больше корень.'
  - id: q4
    kind: input
    step: 3
    prompt: 'Сравни $5\sqrt{3}$ и $4\sqrt{5}$. Поставь знак.'
    answerKind: compare
    answer: '<'
    explain: '$5\sqrt{3}=\sqrt{25\cdot 3}=\sqrt{75}$, $4\sqrt{5}=\sqrt{16\cdot 5}=\sqrt{80}$, а $75<80$.'
  - id: q5
    kind: choice
    step: 4
    prompt: 'Сравни $-\sqrt{7}$ и $-\sqrt{10}$.'
    options:
      - '$-\sqrt{7}<-\sqrt{10}$'
      - '$-\sqrt{7}>-\sqrt{10}$'
      - 'Они равны'
    correct: 1
    explain: '$\sqrt{7}<\sqrt{10}$, а у отрицательных чисел всё наоборот: чем меньше модуль, тем число больше.'

  - id: q6
    kind: choice
    step: 5
    prompt: 'При каких значениях $x$ имеет смысл выражение $\\sqrt{-16x}$?'
    options:
      - '$x\\ge 0$'
      - '$x>0$'
      - '$x<0$'
      - '$x\\le 0$'
    correct: 3
    explain: 'Нужно $-16x\\ge 0$. Число $-16$ отрицательное, значит $x$ должен быть отрицательным или нулём: $x\\le 0$.'
  - id: q7
    kind: choice
    step: 6
    prompt: 'При каком значении аргумента значение функции $y=\\sqrt{x}$ равно $4$?'
    options:
      - '$\\pm 16$'
      - '$2$'
      - '$\\pm 2$'
      - '$16$'
    correct: 3
    explain: '$\\sqrt{x}=4$, значит $x=4^2=16$. Отрицательным $x$ быть не может.'

