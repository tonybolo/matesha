id: '01-rational-fractions'
order: 1
title: Рациональные дроби и их свойства
summary: Что такое рациональная дробь, когда она имеет смысл, основное свойство дроби и сокращение.
passScore: 4

steps:
  - id: s1
    title: Что такое рациональные выражения
    blocks:
      - type: text
        text: >-
          В 7 классе мы работали с **целыми выражениями**: числа и переменные, которые соединены сложением,
          вычитанием, умножением и делением на число. Например, $3x^2-5x$ или $\frac{x+1}{2}$.
      - type: text
        text: >-
          Теперь разрешим делить **на выражение с переменной**. Получатся **дробные выражения**:
          $\frac{3}{x}$, $\frac{x+1}{x-2}$.
      - type: note
        kind: tip
        text: >-
          Целые и дробные выражения вместе называют **рациональными выражениями**.
          Дробь, у которой числитель и знаменатель — многочлены, называют **рациональной дробью**.
      - type: example
        title: Целое или дробное?
        steps:
          - '$5x+1$ — целое выражение.'
          - '$\frac{x+1}{5}$ — тоже целое: делим только на число $5$.'
          - '$\frac{5}{x+1}$ — дробное: в знаменателе есть переменная.'
          - '$\frac{x^2-1}{x}$ — дробное.'

  - id: s2
    title: Когда дробь имеет смысл
    blocks:
      - type: text
        text: >-
          На ноль делить нельзя. Значит, в дроби $\frac{a}{b}$ знаменатель $b$ **не может равняться нулю**.
          Значения переменной, при которых знаменатель равен нулю, называют **недопустимыми**:
          при них дробь не имеет смысла.
      - type: example
        title: Ищем недопустимые значения
        steps:
          - '$\frac{x+1}{x-2}$: знаменатель $x-2=0$, значит $x=2$. Недопустимо только $x=2$.'
          - '$\frac{5}{x^2-9}$: $x^2-9=0$, то есть $(x-3)(x+3)=0$. Недопустимы $x=3$ и $x=-3$.'
          - '$\frac{x}{x^2+1}$: сумма $x^2+1$ всегда больше нуля. Недопустимых значений нет.'
      - type: note
        kind: tip
        text: 'Поиграй с ползунком ниже: двигай $x$ и смотри, что происходит у «запретной» точки.'
      - type: viz
        id: odz
        preset: single

  - id: s3
    title: Основное свойство дроби
    blocks:
      - type: text
        text: >-
          Если числитель и знаменатель дроби умножить (или разделить) на одно и то же число, не равное нулю,
          значение дроби **не изменится**. Например, $\frac{1}{2}=\frac{3}{6}$.
      - type: viz
        id: bars
        preset: equal
      - type: math
        tex: '\frac{a}{b}=\frac{a\cdot c}{b\cdot c},\qquad c\neq 0'
      - type: text
        text: 'С переменными всё так же, только $c$ может быть выражением. Главное, чтобы оно не равнялось нулю.'
      - type: example
        title: Приведём дробь к знаменателю $6a$
        steps:
          - 'Знаменатель $2a$ нужно превратить в $6a$: $6a:2a=3$. Это **дополнительный множитель**.'
          - '$\frac{5}{2a}=\frac{5\cdot 3}{2a\cdot 3}=\frac{15}{6a}$'
      - type: note
        kind: tip
        text: >-
          Правило знаков — это то же основное свойство при $c=-1$:
          $\frac{-a}{-b}=\frac{a}{b}$, $\ \frac{a}{-b}=-\frac{a}{b}$, $\ \frac{-a}{b}=-\frac{a}{b}$.

  - id: s4
    title: Сокращение дробей
    blocks:
      - type: text
        text: >-
          **Сократить дробь** — значит разделить числитель и знаменатель на их общий множитель.
          Это основное свойство, прочитанное справа налево.
      - type: example
        title: Одночлены
        steps:
          - '$\frac{6x^2}{9x}=\frac{2\cdot 3\cdot x\cdot x}{3\cdot 3\cdot x}$'
          - 'Вычёркиваем $3$ и $x$: получаем $\frac{2x}{3}$.'
      - type: text
        text: 'Если в числителе и знаменателе многочлены, сначала **разложи их на множители**, и только потом сокращай.'
      - type: note
        kind: warn
        text: >-
          Сокращать можно только **множители**, но не слагаемые! В дроби $\frac{x+3}{x}$ нельзя «сократить» $x$:
          он входит в сумму, а не в произведение. Проверь на числах: при $x=3$ получится $\frac{6}{3}=2$, а не $3$.
      - type: viz
        id: cancel
        preset: first

  - id: s5
    title: Раскладываем на множители
    blocks:
      - type: text
        text: 'Три инструмента из 7 класса, которые нужны для сокращения:'
      - type: math
        tex: 'ax+ay=a(x+y)\qquad a^2-b^2=(a-b)(a+b)\qquad a^2\pm 2ab+b^2=(a\pm b)^2'
      - type: example
        title: Разность квадратов
        steps:
          - '$\frac{x^2-9}{x^2+3x}=\frac{(x-3)(x+3)}{x(x+3)}$'
          - 'Сокращаем на $(x+3)$: $\frac{x-3}{x}$.'
      - type: example
        title: Квадрат разности
        steps:
          - '$\frac{a^2-4a+4}{a^2-4}=\frac{(a-2)^2}{(a-2)(a+2)}$'
          - 'Сокращаем на $(a-2)$: $\frac{a-2}{a+2}$.'
      - type: example
        title: Общий множитель
        steps:
          - '$\frac{4a-4b}{a^2-b^2}=\frac{4(a-b)}{(a-b)(a+b)}=\frac{4}{a+b}$'
      - type: viz
        id: cancel
        preset: second

  - id: s6
    title: Противоположные множители и ловушки
    blocks:
      - type: text
        text: 'Выражения $a-b$ и $b-a$ — **противоположные**: $b-a=-(a-b)$. Поэтому дробь с такими числителем и знаменателем равна $-1$:'
      - type: math
        tex: '\frac{a-b}{b-a}=\frac{a-b}{-(a-b)}=-1'
      - type: example
        title: Сокращаем с противоположными множителями
        steps:
          - '$\frac{3-x}{x^2-9}=\frac{-(x-3)}{(x-3)(x+3)}$'
          - 'После сокращения: $-\frac{1}{x+3}$.'
      - type: note
        kind: warn
        text: >-
          Сокращённая дробь равна исходной **только при допустимых значениях исходной дроби**.
          Например, $\frac{x^2-9}{x+3}=x-3$, но при $x=-3$ левая часть не имеет смысла, а правая — имеет.

check:
  - id: q1
    kind: choice
    step: 0
    prompt: 'Какое из выражений **дробное**?'
    options:
      - '$\dfrac{x+1}{5}$'
      - '$\dfrac{5}{x+1}$'
      - '$5x+1$'
      - '$x^2-1$'
    correct: 1
    explain: 'В знаменателе $\frac{5}{x+1}$ стоит переменная, поэтому выражение дробное. Деление на число $5$ не делает выражение дробным.'
  - id: q2
    kind: input
    step: 1
    prompt: 'При каком значении $x$ дробь $\dfrac{7}{x-4}$ не имеет смысла?'
    answerKind: roots
    answer: '4'
    explain: 'Знаменатель равен нулю: $x-4=0$, значит $x=4$.'
  - id: q3
    kind: choice
    step: 3
    prompt: 'Можно ли сократить дробь $\dfrac{x+5}{x}$ на $x$?'
    options:
      - 'Да, получится $5$'
      - 'Да, получится $1+5$'
      - 'Нет: $x$ в числителе — слагаемое, а не множитель'
      - 'Да, получится $\dfrac{1}{5}$'
    correct: 2
    explain: 'Сокращать можно только множители. В числителе $x+5$ переменная $x$ — слагаемое. Проверь при $x=1$: $\frac{6}{1}=6$, а не $5$.'
  - id: q4
    kind: input
    step: 3
    prompt: 'Сократите дробь $\dfrac{4a^3}{6a}$.'
    answerKind: expr
    answer: '2a^2/3'
    reduce: true
    explain: '$\frac{4a^3}{6a}=\frac{2\cdot 2\cdot a\cdot a\cdot a}{2\cdot 3\cdot a}=\frac{2a^2}{3}$.'
  - id: q5
    kind: choice
    step: 5
    prompt: 'Чему равна дробь $\dfrac{a-b}{b-a}$ (при $a\neq b$)?'
    options:
      - '$1$'
      - '$-1$'
      - '$0$'
      - '$\dfrac{a}{b}$'
    correct: 1
    explain: 'Так как $b-a=-(a-b)$, то $\frac{a-b}{b-a}=\frac{a-b}{-(a-b)}=-1$.'

tasks:
  # ---------- Уровень 1 ----------
  - id: t1-01
    level: 1
    source: авторская
    prompt: 'При каком значении $x$ не имеет смысла дробь {expr}?'
    expr: '5/(x-3)'
    answerKind: roots
    answer: '3'
    verify: {op: odz}
    hint: 'Приравняй знаменатель к нулю.'
    solution:
      - '$x-3=0$'
      - '$x=3$'
  - id: t1-02
    level: 1
    source: авторская
    prompt: 'При каком значении $x$ не имеет смысла дробь {expr}?'
    expr: '(x+1)/(2x+6)'
    answerKind: roots
    answer: '-3'
    verify: {op: odz}
    hint: 'Знаменатель равен нулю при $2x+6=0$.'
    solution:
      - '$2x+6=0$'
      - '$2x=-6$'
      - '$x=-3$'
  - id: t1-03
    level: 1
    source: авторская
    prompt: 'При каких значениях $x$ не имеет смысла дробь {expr}? (Несколько значений запиши через «;».)'
    expr: 'x/(x^2-16)'
    answerKind: roots
    answer: '4; -4'
    verify: {op: odz}
    hint: 'Разложи $x^2-16$ на множители по формуле разности квадратов.'
    solution:
      - '$x^2-16=0$'
      - '$(x-4)(x+4)=0$'
      - '$x=4$ или $x=-4$'
  - id: t1-04
    level: 1
    source: авторская
    prompt: 'При каких значениях $a$ не имеет смысла дробь {expr}? (Через «;».)'
    expr: '(a-2)/(a(a+5))'
    answerKind: roots
    answer: '0; -5'
    verify: {op: odz}
    hint: 'Произведение равно нулю, когда хотя бы один множитель равен нулю.'
    solution:
      - '$a(a+5)=0$'
      - '$a=0$ или $a+5=0$'
      - '$a=0$ или $a=-5$'
  - id: t1-05
    level: 1
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '6x^2/(9x)'
    answerKind: expr
    answer: '2x/3'
    reduce: true
    verify: {op: reduce}
    hint: 'Раздели числитель и знаменатель на $3x$.'
    solution:
      - '$\frac{6x^2}{9x}=\frac{2\cdot 3\cdot x\cdot x}{3\cdot 3\cdot x}$'
      - 'Сокращаем $3$ и $x$: $\frac{2x}{3}$'
  - id: t1-06
    level: 1
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '15a^3b/(10ab^2)'
    answerKind: expr
    answer: '3a^2/(2b)'
    reduce: true
    verify: {op: reduce}
    hint: 'Сокращай по частям: числа, потом степени $a$, потом степени $b$.'
    solution:
      - 'Числа: $\frac{15}{10}=\frac{3}{2}$'
      - 'Степени $a$: $\frac{a^3}{a}=a^2$'
      - 'Степени $b$: $\frac{b}{b^2}=\frac{1}{b}$'
      - 'Итог: $\frac{3a^2}{2b}$'
  - id: t1-07
    level: 1
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(3x+3)/(x+1)'
    answerKind: expr
    answer: '3'
    reduce: true
    verify: {op: reduce}
    hint: 'Вынеси общий множитель в числителе.'
    solution:
      - '$\frac{3x+3}{x+1}=\frac{3(x+1)}{x+1}$'
      - 'Сокращаем на $(x+1)$: $3$'
  - id: t1-08
    level: 1
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(2x+2y)/(4x+4y)'
    answerKind: expr
    answer: '1/2'
    reduce: true
    verify: {op: reduce}
    hint: 'Вынеси общие множители в числителе и знаменателе.'
    solution:
      - '$\frac{2(x+y)}{4(x+y)}$'
      - 'Сокращаем на $2(x+y)$: $\frac{1}{2}$'
  - id: t1-09
    level: 1
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(x^2-x)/x'
    answerKind: expr
    answer: 'x-1'
    reduce: true
    verify: {op: reduce}
    hint: 'Вынеси $x$ за скобки в числителе.'
    solution:
      - '$\frac{x^2-x}{x}=\frac{x(x-1)}{x}$'
      - 'Сокращаем на $x$: $x-1$'
  - id: t1-10
    level: 1
    source: авторская
    prompt: 'Найди значение дроби {expr} при $x=4$.'
    expr: '(x^2-4)/(x^2-2x)'
    answerKind: expr
    answer: '3/2'
    verify: {op: value, subs: {x: '4'}}
    hint: 'Подставь $x=4$ в числитель и в знаменатель отдельно.'
    solution:
      - 'Числитель: $4^2-4=12$'
      - 'Знаменатель: $4^2-2\cdot 4=8$'
      - '$\frac{12}{8}=\frac{3}{2}$'
  - id: t1-11
    level: 1
    source: авторская
    prompt: 'Вместо «?» впиши выражение так, чтобы равенство было верным: $\dfrac{5}{2a}=\dfrac{?}{6a^2}$'
    answerKind: expr
    answer: '15a'
    verify: {op: custom, sympy: '5/(2*a)*6*a**2'}
    hint: 'Во сколько раз знаменатель $6a^2$ больше, чем $2a$? На это же выражение умножь числитель.'
    solution:
      - '$6a^2:2a=3a$ — дополнительный множитель'
      - '$5\cdot 3a=15a$'

  # ---------- Уровень 2 ----------
  - id: t1-12
    level: 2
    source: авторская
    prompt: 'При каких значениях $x$ не имеет смысла дробь {expr}? (Через «;».)'
    expr: '3/(x^2-5x)'
    answerKind: roots
    answer: '0; 5'
    verify: {op: odz}
    hint: 'Вынеси $x$ за скобки в знаменателе.'
    solution:
      - '$x^2-5x=x(x-5)$'
      - '$x(x-5)=0$'
      - '$x=0$ или $x=5$'
  - id: t1-13
    level: 2
    source: авторская
    prompt: 'При каких значениях $x$ не имеет смысла дробь {expr}? Если таких значений нет, напиши «нет».'
    expr: '(x+2)/(x^2+4)'
    answerKind: roots
    answer: 'нет'
    verify: {op: odz}
    hint: 'Может ли сумма $x^2+4$ быть равной нулю? Чему равен $x^2$ в худшем случае?'
    solution:
      - '$x^2\ge 0$, поэтому $x^2+4\ge 4>0$'
      - 'Знаменатель никогда не равен нулю: недопустимых значений нет.'
  - id: t1-14
    level: 2
    source: авторская
    prompt: 'При каком значении $x$ не имеет смысла дробь {expr}?'
    expr: '(x-1)/(x^2-6x+9)'
    answerKind: roots
    answer: '3'
    verify: {op: odz}
    hint: 'Знаменатель — квадрат разности.'
    solution:
      - '$x^2-6x+9=(x-3)^2$'
      - '$(x-3)^2=0$, значит $x=3$'
  - id: t1-15
    level: 2
    source: авторская
    prompt: 'При каких значениях $x$ не имеет смысла выражение {expr}? (Через «;».)'
    expr: '1/(x-1)+1/(x+2)'
    answerKind: roots
    answer: '1; -2'
    verify: {op: odz}
    hint: 'Нужно, чтобы обе дроби имели смысл: оба знаменателя не равны нулю.'
    solution:
      - '$x-1=0$ при $x=1$'
      - '$x+2=0$ при $x=-2$'
      - 'Недопустимы $x=1$ и $x=-2$.'
  - id: t1-16
    level: 2
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(x^2-9)/(x^2+3x)'
    answerKind: expr
    answer: '(x-3)/x'
    reduce: true
    verify: {op: reduce}
    hint: 'Разность квадратов в числителе, общий множитель в знаменателе.'
    solution:
      - '$\frac{(x-3)(x+3)}{x(x+3)}$'
      - 'Сокращаем на $(x+3)$: $\frac{x-3}{x}$'
  - id: t1-17
    level: 2
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(a^2-b^2)/(a^2-ab)'
    answerKind: expr
    answer: '(a+b)/a'
    reduce: true
    verify: {op: reduce}
    hint: 'В знаменателе вынеси $a$ за скобки.'
    solution:
      - '$\frac{(a-b)(a+b)}{a(a-b)}$'
      - 'Сокращаем на $(a-b)$: $\frac{a+b}{a}$'
  - id: t1-18
    level: 2
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(x^2-4x+4)/(x^2-4)'
    answerKind: expr
    answer: '(x-2)/(x+2)'
    reduce: true
    verify: {op: reduce}
    hint: 'Числитель — квадрат разности, знаменатель — разность квадратов.'
    solution:
      - '$\frac{(x-2)^2}{(x-2)(x+2)}$'
      - 'Сокращаем на $(x-2)$: $\frac{x-2}{x+2}$'
  - id: t1-19
    level: 2
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(4a^2-1)/(2a^2+a)'
    answerKind: expr
    answer: '(2a-1)/a'
    reduce: true
    verify: {op: reduce}
    hint: '$4a^2-1=(2a)^2-1^2$.'
    solution:
      - '$\frac{(2a-1)(2a+1)}{a(2a+1)}$'
      - 'Сокращаем на $(2a+1)$: $\frac{2a-1}{a}$'
  - id: t1-20
    level: 2
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(m^2+2mn+n^2)/(3m+3n)'
    answerKind: expr
    answer: '(m+n)/3'
    reduce: true
    verify: {op: reduce}
    hint: 'Числитель — квадрат суммы.'
    solution:
      - '$\frac{(m+n)^2}{3(m+n)}$'
      - 'Сокращаем на $(m+n)$: $\frac{m+n}{3}$'
  - id: t1-21
    level: 2
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(a-b)/(b-a)'
    answerKind: expr
    answer: '-1'
    reduce: true
    verify: {op: reduce}
    hint: 'Вынеси $-1$ за скобку в знаменателе: $b-a=-(a-b)$.'
    solution:
      - '$\frac{a-b}{b-a}=\frac{a-b}{-(a-b)}$'
      - 'Сокращаем на $(a-b)$: $-1$'
  - id: t1-22
    level: 2
    source: авторская
    prompt: 'Сократите дробь {expr}.'
    expr: '(3-x)/(x^2-9)'
    answerKind: expr
    answer: '-1/(x+3)'
    reduce: true
    verify: {op: reduce}
    hint: 'Замени $3-x$ на $-(x-3)$.'
    solution:
      - '$\frac{-(x-3)}{(x-3)(x+3)}$'
      - 'Сокращаем на $(x-3)$: $-\frac{1}{x+3}$'
  - id: t1-23
    level: 2
    source: авторская
    prompt: 'Вместо «?» впиши выражение так, чтобы равенство было верным: $\dfrac{x-2}{x+3}=\dfrac{?}{x^2-9}$'
    answerKind: expr
    answer: '(x-2)(x-3)'
    verify: {op: custom, sympy: '(x-2)/(x+3)*(x**2-9)'}
    hint: 'Разложи $x^2-9$ на множители и найди дополнительный множитель к знаменателю $x+3$.'
    solution:
      - '$x^2-9=(x-3)(x+3)$, дополнительный множитель $(x-3)$'
      - '$(x-2)(x-3)$'

  # ---------- Уровень 3 ----------
  - id: t1-24
    level: 3
    source: авторская
    prompt: 'При каких значениях $x$ не имеет смысла дробь {expr}? (Через «;».)'
    expr: '(x-5)/(x^3-x)'
    answerKind: roots
    answer: '0; 1; -1'
    verify: {op: odz}
    hint: 'Вынеси $x$ за скобки, затем примени разность квадратов.'
    solution:
