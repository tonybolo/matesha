id: 'geo-01-quadrilaterals'
subject: geometry
order: 1
title: 'Определения четырёхугольников'
summary: Четырёхугольник и его части, сумма углов 360°, параллелограмм, прямоугольник, ромб, квадрат и трапеция — и как они связаны «семейным деревом».
passScore: 5

steps:
  - id: s1
    title: 'Четырёхугольник и его части'
    blocks:
      - type: text
        text: >-
          Нарисуй на листе четыре точки так, чтобы никакие три не лежали на одной прямой. Теперь соедини их отрезками по кругу:
          первую со второй, вторую с третьей, третью с четвёртой и четвёртую с первой. Получилась замкнутая фигура с четырьмя углами —
          **четырёхугольник**. Точки называются **вершинами**, а отрезки — **сторонами**.
      - type: text
        text: >-
          Вершины называют большими буквами по кругу: $A$, $B$, $C$, $D$. Сторону называют по двум её концам: $AB$, $BC$, $CD$, $DA$.
          Нажимай кнопки на картинке и смотри, как называются части фигуры. А внизу можно подвигать вершину и проверить,
          когда четырёхугольник «ломается».
      - type: viz
        id: quadParts
      - type: note
        kind: tip
        text: >-
          Запомни: у четырёхугольника **4 вершины, 4 стороны и 2 диагонали**. **Соседние** вершины соединены стороной
          (например, $A$ и $B$), **противоположные** — нет ($A$ и $C$). **Диагональ** — отрезок между противоположными вершинами:
          $AC$ и $BD$.
      - type: note
        kind: warn
        text: >-
          Не путай сторону и диагональ: сторона идёт между **соседними** вершинами, диагональ — между **противоположными**.
          И помни два условия: никакие три вершины не лежат на одной прямой, а стороны друг друга не пересекают.
          Иначе получится «бантик» или «просто треугольник», а не четырёхугольник.
      - type: text
        text: >-
          Если обойти все стороны по кругу и сложить их длины, получится **периметр**: $P=AB+BC+CD+DA$.
          Так считают, сколько нужно забора вокруг участка.
      - type: example
        title: 'Стороны четырёхугольника 3 см, 5 см, 4 см и 6 см. Чему равен периметр?'
        steps:
          - 'Периметр — это сумма длин всех сторон.'
          - '$P=3+5+4+6=18$ (см).'

  - id: s2
    title: 'Сумма углов: всегда 360°'
    blocks:
      - type: text
        text: >-
          Возьми любой четырёхугольник и проведи в нём одну диагональ. Она разрежет его на **два треугольника**.
          А в каждом треугольнике сумма углов равна $180^\circ$ — это ты уже знаешь. Углы двух треугольников вместе
          как раз и составляют углы четырёхугольника.
      - type: text
        text: >-
          Значит, сумма углов четырёхугольника равна $180^\circ+180^\circ=360^\circ$. Проверь сам: двигай вершины на картинке.
          Углы будут меняться, а сумма останется той же.
      - type: viz
        id: angleSum
      - type: note
        kind: tip
        text: >-
          Сумма углов выпуклого четырёхугольника всегда равна $360^\circ$:
          $\angle A+\angle B+\angle C+\angle D=360^\circ$.
      - type: note
        kind: warn
        text: >-
          Не путай с треугольником: у треугольника сумма углов $180^\circ$, у четырёхугольника — $360^\circ$.
          А «выпуклый» значит «без вмятин»: все углы меньше $180^\circ$. В этой теме все фигуры выпуклые.
      - type: example
        title: 'Три угла четырёхугольника равны 80°, 95° и 110°. Найди четвёртый.'
        steps:
          - 'Сложим три угла: $80^\circ+95^\circ+110^\circ=285^\circ$.'
          - 'Всего должно быть $360^\circ$, значит, четвёртый угол равен $360^\circ-285^\circ=75^\circ$.'

  - id: s3
    title: 'Параллелограмм'
    blocks:
      - type: text
        text: >-
          Представь две пары рельсов, которые пересекают друг друга, как решётка на окне. Рельсы в каждой паре идут рядом
          и никогда не встречаются — они **параллельны**. Клетка, которая получилась между ними, — это **параллелограмм**.
      - type: note
        kind: tip
        text: >-
          **Параллелограмм** — четырёхугольник, у которого противоположные стороны попарно параллельны:
          $AB\parallel CD$ и $BC\parallel AD$.
      - type: text
        text: >-
          Покрути угол и длину стороны на картинке: параллелограмм то «клонится», то вытягивается,
          но обе пары противоположных сторон остаются параллельными.
      - type: viz
        id: parLab
        preset: par
      - type: note
        kind: tip
        text: >-
          Бонус (докажем в следующей теме): у параллелограмма **противоположные стороны равны**, **противоположные углы равны**,
          а **соседние углы вместе дают $180^\circ$**.
      - type: note
        kind: warn
        text: >-
          Параллелограмм не обязан быть «ровным»: углы у него могут быть любыми, а соседние стороны — разной длины.
          Особые случаи (прямоугольник, ромб, квадрат) мы разберём дальше.
      - type: example
        title: 'В параллелограмме $ABCD$ угол $A$ равен $70^\circ$. Найди остальные углы.'
        steps:
          - 'Соседние углы вместе дают $180^\circ$: $\angle B=180^\circ-70^\circ=110^\circ$.'
          - 'Противоположные углы равны: $\angle C=\angle A=70^\circ$ и $\angle D=\angle B=110^\circ$.'
          - 'Проверка по сумме углов: $70^\circ+110^\circ+70^\circ+110^\circ=360^\circ$.'

  - id: s4
    title: 'Прямоугольник'
    blocks:
      - type: text
        text: >-
          Экран телефона, тетрадный лист, дверь — всё это прямоугольники. Возьми параллелограмм и «выпрями» его:
          пусть все четыре угла станут прямыми, по $90^\circ$. Получится **прямоугольник**.
      - type: note
        kind: tip
        text: '**Прямоугольник** — параллелограмм, у которого все углы прямые.'
      - type: text
        text: >-
          Подвигай угол $A$ на картинке: пока он ровно $90^\circ$, это прямоугольник. Чуть наклонил — снова
          «просто параллелограмм».
      - type: viz
        id: parLab
        preset: rect
      - type: note
        kind: tip
        text: >-
          Хитрость: у параллелограмма достаточно **одного** прямого угла. Соседний угол тогда равен $180^\circ-90^\circ=90^\circ$,
          а противоположные им равны им. Значит, все четыре угла прямые.
      - type: note
        kind: warn
        text: >-
          Прямоугольник — это **параллелограмм**, а не «совсем другая фигура». Всё, что верно для параллелограмма
          (стороны попарно параллельны и равны), верно и для него. А наоборот не работает: не каждый параллелограмм — прямоугольник.
      - type: example
        title: 'У параллелограмма $ABCD$ угол $A$ прямой. Что это за фигура?'
        steps:
          - 'Соседний угол: $\angle B=180^\circ-90^\circ=90^\circ$.'
          - 'Противоположные углы равны, поэтому $\angle C=90^\circ$ и $\angle D=90^\circ$.'
          - 'Все четыре угла прямые, значит, это **прямоугольник**.'

  - id: s5
    title: 'Ромб'
    blocks:
      - type: text
        text: >-
          Масть «бубны» на игральных картах — ромб. Возьми четыре одинаковые палочки и сложи из них параллелограмм:
          все стороны равны. Получится **ромб**.
      - type: note
        kind: tip
        text: '**Ромб** — параллелограмм, у которого все стороны равны.'
      - type: text
        text: >-
          Меняй длину стороны $AD$ на картинке: когда она станет равна $AB$, параллелограмм превратится в ромб.
      - type: viz
        id: parLab
        preset: rhomb
      - type: note
        kind: tip
        text: >-
          Хитрость: если у четырёхугольника **все четыре стороны равны**, то его противоположные стороны сами окажутся параллельными.
          Такой четырёхугольник — сразу параллелограмм, а значит, ромб.
      - type: note
        kind: warn
        text: >-
          У ромба равны стороны, а углы могут быть любыми: и острыми, и тупыми. Ромб не обязан быть «квадратным».
      - type: example
        title: 'Периметр ромба равен 36 см. Найди его сторону.'
        steps:
          - 'У ромба все четыре стороны равны, поэтому периметр — это сторона, умноженная на 4.'
          - '$a=36:4=9$ (см).'

  - id: s6
    title: 'Квадрат'
    blocks:
      - type: text
        text: >-
          Квадрат — самая «правильная» фигура: стороны равны, как у ромба, и углы прямые, как у прямоугольника.
          Он получает свойства сразу от двух «родителей».
      - type: note
        kind: tip
        text: >-
          **Квадрат** — прямоугольник, у которого все стороны равны. Значит, квадрат — это одновременно
          прямоугольник (все углы прямые), ромб (все стороны равны) и параллелограмм.
      - type: text
        text: >-
          Попробуй на картинке: в квадрате поменяй угол — получится ромб, а поменяй длину стороны — получится прямоугольник.
      - type: viz
        id: parLab
        preset: square
      - type: note
        kind: warn
        text: >-
          Часто говорят: «Это не прямоугольник, это квадрат». Ошибка! Квадрат — особый прямоугольник.
          Так же, как каждый пудель — собака, но не каждая собака — пудель: каждый квадрат — прямоугольник,
          но не каждый прямоугольник — квадрат.
      - type: example
        title: 'У прямоугольника стороны 5 см и 5 см. Как назвать его точнее?'
        steps:
          - 'Все углы прямые — это прямоугольник.'
          - 'Но две соседние стороны равны: $5=5$. У прямоугольника противоположные стороны тоже равны, значит, равны все четыре.'
          - 'Прямоугольник с равными сторонами — это **квадрат** (а ещё ромб и параллелограмм).'

  - id: s7
    title: 'Трапеция'
    blocks:
      - type: text
        text: >-
          Вспомни ведёрко для песка или крышу палатки (вид сбоку): верх и низ ровные и параллельные, а бока наклонены
          и сходятся. Такая фигура — **трапеция**.
      - type: note
        kind: tip
        text: >-
          **Трапеция** — четырёхугольник, у которого **две стороны параллельны, а две другие не параллельны**.
          Параллельные стороны называют **основаниями**, непараллельные — **боковыми сторонами**.
      - type: text
        text: >-
          Меняй верхнее основание и сдвиг на картинке. Смотри, что картинка пишет про боковые стороны.
      - type: viz
        id: trapLab
      - type: note
        kind: tip
        text: >-
          Бывают особые трапеции. **Равнобедренная** — боковые стороны равны. **Прямоугольная** — один из углов прямой
          (тогда прямых углов ровно два). А ещё: основания параллельны, поэтому два угла при одной боковой стороне
          вместе дают $180^\circ$.
      - type: note
        kind: warn
        text: >-
          **Параллелограмм — не трапеция!** У трапеции параллельна ровно **одна** пара сторон, а у параллелограмма — **две**.
          В некоторых книгах трапецией называют и параллелограмм, но у нас в учебнике так не принято.
          Видишь на картинке: когда верхнее основание сравнялось с нижним, боковые стороны тоже стали параллельными
          и трапеция превратилась в параллелограмм.
      - type: example
        title: 'В трапеции $ABCD$ основания $AD$ и $BC$, $\angle A=70^\circ$, $\angle D=80^\circ$. Найди $\angle B$ и $\angle C$.'
        steps:
          - 'Основания параллельны, поэтому углы при боковой стороне $AB$ вместе дают $180^\circ$: $\angle B=180^\circ-70^\circ=110^\circ$.'
          - 'Так же при боковой стороне $CD$: $\angle C=180^\circ-80^\circ=100^\circ$.'
          - 'Проверка: $70^\circ+110^\circ+100^\circ+80^\circ=360^\circ$.'

  - id: s8
    title: 'Семейное дерево четырёхугольников'
    blocks:
      - type: text
        text: >-
          Все фигуры этой темы — одна большая семья. Наверху — самый «общий» родственник: просто **четырёхугольник**.
          У него два ребёнка: **трапеция** и **параллелограмм**. У параллелограмма свои дети — **прямоугольник** и **ромб**.
          А у них общий ребёнок — **квадрат**: он унаследовал свойства обоих.
      - type: text
        text: >-
          Сыграй в «Угадай фигуру»: включай свойства, и картинка назовёт самое точное имя фигуры.
          Потом нажимай на фигуры в дереве — увидишь определение и родителей.
      - type: viz
        id: quadFamily
      - type: note
        kind: tip
        text: >-
          Читай дерево снизу вверх: каждая фигура является всеми своими «родителями». Квадрат — это ромб, прямоугольник,
          параллелограмм и четырёхугольник. Наоборот не всегда: не каждый ромб — квадрат.
      - type: note
        kind: warn
        text: >-
          Называй фигуру **самым точным** именем — самым «нижним» в дереве. Если все стороны равны и все углы прямые,
          говори «квадрат», хотя фигура ещё и ромб, и прямоугольник.
      - type: text
        text: >-
          **Как узнать фигуру по клеточкам.** Если даны координаты вершин, рисовать необязательно. Идём от вершины к вершине
          и записываем «шаги»: на сколько вправо и на сколько вверх. Дальше три проверки.
      - type: text
        text: >-
          **1. Параллельны ли стороны?** Да, если шаги «в одну линию»: один получается из другого умножением на число
          (например, $(4;1)$ и $(-4;-1)$). **2. Равны ли стороны?** Да, если равны суммы квадратов шагов:
          для шага $(a;b)$ это $a^2+b^2$. **3. Прямой ли угол?** Для шагов $(a;b)$ и $(c;d)$ угол прямой,
          когда $a\cdot c+b\cdot d=0$ (например, $(2;1)$ и $(-1;2)$: $2\cdot(-1)+1\cdot 2=0$).
      - type: example
        title: 'Какая это фигура: $A(0;0)$, $B(4;1)$, $C(5;4)$, $D(1;3)$?'
        steps:
          - 'Шаги по сторонам: $AB=(4;1)$, $BC=(1;3)$, $CD=(-4;-1)$, $DA=(-1;-3)$.'
          - 'Шаги $AB$ и $CD$ отличаются только знаками, значит, эти стороны параллельны. Так же $BC$ и $DA$. Это параллелограмм.'
          - 'Длины: $AB^2=4^2+1^2=17$, $BC^2=1^2+3^2=10$. Соседние стороны разные, значит, это не ромб.'
          - 'Угол $B$: $4\cdot 1+1\cdot 3=7$, не ноль. Угол не прямой, значит, это не прямоугольник.'
          - 'Ответ: просто **параллелограмм**.'

  - id: s9
    title: '⭐ Тонкие вопросы'
    blocks:
      - type: text
        text: >-
          Здесь — вопросы-«ловушки». Главное правило: чтобы сказать «нет» на вопрос «всякий ли X является Y?»,
          достаточно найти **один пример** X, который не является Y. Такой пример называют **контрпримером**.
      - type: example
        title: 'Всякий ли ромб является прямоугольником?'
        steps:
          - 'Ищем контрпример. У ромба все стороны равны, а углы могут быть любыми. Возьми «скошенный» ромб с углами $60^\circ$ и $120^\circ$.'
          - 'Углы не прямые, значит, это не прямоугольник.'
          - 'Ответ: **нет**. Ромб с прямыми углами — это квадрат, он и ромб, и прямоугольник, но так бывает не у каждого ромба.'
      - type: example
        title: 'Может ли у трапеции быть прямой угол?'
        steps:
          - 'Может: такая трапеция называется прямоугольной.'
          - 'Основания параллельны, и два угла при одной боковой стороне вместе дают $180^\circ$. Если один из них $90^\circ$, то второй тоже $90^\circ$.'
          - 'Значит, прямых углов у такой трапеции **два**. Три или четыре прямых угла невозможны: тогда это был бы прямоугольник, а он не трапеция.'
      - type: example
        title: 'Может ли трапеция быть одновременно равнобедренной и прямоугольной?'
        steps:
          - 'У прямоугольной трапеции одна боковая сторона перпендикулярна основаниям, а другая наклонная.'
          - 'Наклонная сторона длиннее перпендикуляра (в прямоугольном треугольнике гипотенуза длиннее катета).'
          - 'Значит, боковые стороны разной длины, и равнобедренной такая трапеция быть не может. Ответ: **нет**.'
      - type: example
        title: 'Сколько всего квадратов на рисунке из $2\times 2$ клеток?'
        steps:
          - 'Маленьких, по одной клетке: 4.'
          - 'Большой, из четырёх клеток: 1.'
          - 'Всего $4+1=5$. Не забывай считать и большие квадраты!'
      - type: note
        kind: warn
        text: >-
          Чаще всего ошибаются, забыв про особые случаи: квадрат — это и ромб, и прямоугольник; ромб и прямоугольник —
          это параллелограммы; а параллелограмм — не трапеция (в нашем определении).

check:
  - id: q1
    kind: choice
    step: 0
    prompt: 'Какие стороны четырёхугольника $ABCD$ противоположные?'
    options:
      - '$AB$ и $BC$'
      - '$BC$ и $BD$'
      - '$AB$ и $CD$'
      - '$AB$ и $AC$'
    correct: 2
    explain: 'Противоположные стороны не имеют общей вершины: у $AB$ это $CD$. Стороны $AB$ и $BC$ — соседние, а $AC$ и $BD$ — диагонали, они не стороны.'
  - id: q2
    kind: input
    step: 1
    prompt: 'Три угла четырёхугольника равны $85^\circ$, $100^\circ$ и $75^\circ$. Найдите четвёртый угол.'
    answerKind: expr
    answer: '100'
    placeholder: 'ответ в градусах'
    explain: 'Сумма углов четырёхугольника равна $360^\circ$: $360^\circ-(85^\circ+100^\circ+75^\circ)=360^\circ-260^\circ=100^\circ$.'
  - id: q3
    kind: choice
    step: 2
    prompt: 'Какой четырёхугольник называется параллелограммом?'
    options:
      - 'Четырёхугольник, у которого все стороны равны'
      - 'Четырёхугольник, у которого две стороны параллельны, а две другие нет'
