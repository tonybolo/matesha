id: 'geo-02-parallelogram-trapezoid'
subject: geometry
order: 2
title: 'Задачи по теме «Параллелограмм, трапеция»'
summary: 'Свойства и признаки параллелограмма, его углы, диагонали и биссектрисы, трапеция, средняя линия и площади: всё «на пальцах», с живыми картинками.'
passScore: 5

steps:
  - id: s1
    title: 'Параллелограмм: что в нём одинаковое'
    blocks:
      - type: text
        text: >-
          Возьми четыре палочки: две длинные одинаковой длины и две короткие одинаковой длины. Соедини их шарнирами по кругу так,
          чтобы одинаковые палочки оказались **напротив** друг друга. Получится рамка, которая качается, как раздвижная решётка на воротах.
          Как её ни качай, палочки, что лежат напротив, остаются **параллельными**: параллельные — это как рельсы, они идут рядом
          и никогда не пересекаются. Такая фигура называется **параллелограммом**.
      - type: text
        text: >-
          Параллелограмм $ABCD$ — это четырёхугольник, у которого противоположные стороны параллельны: $AB\parallel CD$ и $BC\parallel AD$.
          Покрути картинку: меняй стороны и наклон и смотри, что всегда остаётся одинаковым.
      - type: viz
        id: parallelogram
        preset: sides
      - type: note
        kind: tip
        text: >-
          Свойство сторон: **противоположные стороны параллелограмма равны**: $AB=CD$ и $BC=AD$.
      - type: text
        text: >-
          Периметр — это длина «забора» вокруг фигуры, то есть сумма всех сторон. Раз стороны напротив равны, достаточно сложить
          две соседние стороны и удвоить.
      - type: math
        tex: 'P=AB+BC+CD+AD=2\cdot(a+b)'
      - type: note
        kind: warn
        text: >-
          Равны стороны, которые лежат **напротив**, а не рядом. Две соседние стороны $a$ и $b$ обычно разные.
      - type: example
        title: 'Периметр равен $30$, одна сторона на $3$ больше соседней. Найди стороны.'
        steps:
          - 'Противоположные стороны равны, поэтому две соседние стороны вместе — половина периметра: $30:2=15$.'
          - 'Пусть меньшая сторона равна $x$, тогда большая равна $x+3$. Их сумма: $x+(x+3)=15$.'
          - '$2x+3=15$, $2x=12$, $x=6$.'
          - 'Стороны: $6$ и $6+3=9$. Проверка: $2\cdot(6+9)=30$.'
      - type: example
        title: 'Периметр равен $40$, стороны относятся как $2:3$. Найди стороны.'
        steps:
          - 'Две соседние стороны вместе: $40:2=20$.'
          - 'Всего $2+3=5$ частей, на одну часть приходится $20:5=4$.'
          - 'Стороны: $2\cdot 4=8$ и $3\cdot 4=12$. Проверка: $2\cdot(8+12)=40$.'

  - id: s2
    title: 'Углы параллелограмма'
    blocks:
      - type: text
        text: >-
          Снова рамка из палочек. Качни её: один угол растёт, а **соседний** уменьшается ровно на столько же. Их сумма не меняется.
          Почему? Стороны $AD$ и $BC$ параллельны, как рельсы, а сторона $AB$ — «шпала», которая их пересекает. Два угла по одну сторону
          от шпалы ($\angle A$ и $\angle B$) называются **односторонними**. У параллельных прямых они вместе дают развёрнутый угол $180^\circ$.
      - type: viz
        id: parallelogram
        preset: angles
      - type: note
        kind: tip
        text: >-
          **Соседние углы** параллелограмма в сумме дают $180^\circ$: $\angle A+\angle B=180^\circ$. **Противоположные углы** равны:
          $\angle A=\angle C$ и $\angle B=\angle D$. Все четыре угла вместе — $360^\circ$.
      - type: note
        kind: tip
        text: >-
          Два факта про параллельные прямые и секущую, которые пригодятся дальше: **односторонние** углы в сумме $180^\circ$, а
          **накрест лежащие** углы (по разные стороны от секущей, как в букве Z) равны. Ещё помни: сумма углов треугольника $180^\circ$.
      - type: note
        kind: warn
        text: >-
          Не путай: напротив — **равны**, рядом — **в сумме $180^\circ$**. Если параллелограмм не прямоугольник, у него два острых угла
          и два тупых, а острые стоят напротив друг друга.
      - type: example
        title: 'Один угол параллелограмма равен $40^\circ$. Найди остальные.'
        steps:
          - 'Противоположный угол тоже $40^\circ$: противоположные углы равны.'
          - 'Соседний угол: $180^\circ-40^\circ=140^\circ$.'
          - 'Угол напротив него тоже $140^\circ$.'
          - 'Проверка: $40^\circ+140^\circ+40^\circ+140^\circ=360^\circ$.'
      - type: example
        title: 'Один угол параллелограмма в $2$ раза больше соседнего. Найди углы.'
        steps:
          - 'Соседние углы в сумме $180^\circ$. Пусть меньший угол равен $x$, тогда больший равен $2x$.'
          - '$x+2x=180^\circ$, $3x=180^\circ$, $x=60^\circ$.'
          - 'Углы параллелограмма: $60^\circ$, $120^\circ$, $60^\circ$, $120^\circ$.'

  - id: s3
    title: 'Диагонали параллелограмма'
    blocks:
      - type: text
        text: >-
          **Диагональ** — отрезок, который соединяет две противоположные вершины. У параллелограмма $ABCD$ их две: $AC$ и $BD$.
          Они пересекаются в точке $O$. Представь два бруска, скреплённых гвоздём в точке $O$, как ножницы. Если гвоздь вбит ровно в
          **середину** каждого бруска, то концы брусков всегда образуют параллелограмм. И наоборот: у любого параллелограмма диагонали
          делят друг друга в точке пересечения пополам. Подвигай диагонали на картинке.
      - type: viz
        id: parallelogram
        preset: diagonals
      - type: note
        kind: tip
        text: >-
          **Диагонали параллелограмма точкой пересечения делятся пополам**: $AO=OC=\dfrac{AC}{2}$ и $BO=OD=\dfrac{BD}{2}$.
      - type: note
        kind: warn
        text: >-
          Диагонали параллелограмма **не обязаны быть равными** и не обязаны быть перпендикулярными. Что они делятся пополам —
          это единственное, что верно про любой параллелограмм.
      - type: example
        title: 'Диагонали параллелограмма $ABCD$ пересекаются в точке $O$, $AC=12$, $BD=10$, $AB=8$. Найди периметр треугольника $AOB$.'
        steps:
          - 'Диагонали делятся пополам: $AO=12:2=6$ и $BO=10:2=5$.'
          - 'Стороны треугольника $AOB$: $AO=6$, $BO=5$, $AB=8$.'
          - 'Периметр: $6+5+8=19$.'
      - type: example
        title: 'Периметр треугольника $AOD$ на $2$ больше периметра треугольника $AOB$, $AB=5$. Найди $AD$.'
        steps:
          - 'У треугольников $AOD$ и $AOB$ общая сторона $AO$, а $OD=OB$, потому что диагональ $BD$ делится пополам.'
          - 'Значит, периметры отличаются только сторонами $AD$ и $AB$: $AD-AB=2$.'
          - '$AD=5+2=7$.'

  - id: s4
    title: 'Биссектриса угла параллелограмма'
    blocks:
      - type: text
        text: >-
          **Биссектриса** — луч, который делит угол пополам, как сгиб, когда уголок листа складывают ровно пополам. В параллелограмме у неё
          есть секрет: она всегда **отрезает равнобедренный треугольник**. Равнобедренный — это когда две стороны равны.
      - type: text
        text: >-
          Проведём биссектрису угла $A$: она встретит сторону $BC$ в точке $M$. Нажимай «Дальше» и смотри, почему $BM=AB$. Можно
          менять стороны и угол, и даже взять биссектрису другого угла.
      - type: viz
        id: bisector
      - type: note
        kind: tip
        text: >-
          Биссектриса угла $A$ параллелограмма отсекает равнобедренный треугольник $ABM$, то есть $BM=AB$. Цепочка такая: $\angle BAM=\angle MAD$
          (биссектриса), $\angle MAD=\angle AMB$ (накрест лежащие при $BC\parallel AD$). Значит, $\angle BAM=\angle AMB$, а напротив
          равных углов лежат равные стороны.
      - type: note
        kind: warn
        text: >-
          Отрезок $BM$ равен именно $AB$, а не $AD$! Для биссектрисы угла $D$ всё зеркально: она отсекает $CK=CD$. Равный отрезок
          считается от вершины, соседней с углом, из которого идёт биссектриса: $B$ для угла $A$, $C$ для угла $D$.
      - type: example
        title: '$AB=6$, $AD=10$. Биссектриса угла $A$ пересекает $BC$ в точке $M$. Найди $BM$ и $MC$.'
        steps:
          - 'Биссектриса отсекает равнобедренный треугольник $ABM$: $BM=AB=6$.'
          - 'Противоположные стороны равны: $BC=AD=10$.'
          - '$MC=BC-BM=10-6=4$.'
      - type: example
        title: 'Биссектриса угла $A$ делит сторону $BC$ на отрезки $BM=5$ и $MC=3$. Найди периметр параллелограмма.'
        steps:
          - '$AB=BM=5$, потому что треугольник $ABM$ равнобедренный.'
          - '$BC=BM+MC=5+3=8$.'
          - '$P=2\cdot(5+8)=26$.'

  - id: s5
    title: 'Признаки параллелограмма'
    blocks:
      - type: text
        text: >-
          Чем **свойство** отличается от **признака**? Свойство говорит, что верно, если мы уже знаем, что фигура — параллелограмм:
          «у параллелограмма противоположные стороны равны». Признак отвечает на обратный вопрос: как **узнать**, что фигура
          параллелограмм. Как с дождём: «если идёт дождь, то асфальт мокрый» — это свойство. А мокрый асфальт ещё не значит, что идёт дождь:
          могла проехать поливалка. Признак — условие, по которому фигуру можно узнать наверняка.
      - type: text
        text: >-
          Если в четырёхугольнике $ABCD$ выполнено **любое одно** из этих трёх условий, то он точно параллелограмм:
      - type: note
        kind: tip
        text: >-
          **Признак 1.** Две стороны равны и параллельны: $AB\parallel CD$ и $AB=CD$.
      - type: note
        kind: tip
        text: >-
          **Признак 2.** Противоположные стороны попарно равны: $AB=CD$ и $BC=AD$.
      - type: note
        kind: tip
        text: >-
          **Признак 3.** Диагонали пересекаются и точкой пересечения делятся пополам: $AO=OC$ и $BO=OD$.
      - type: viz
        id: parallelogram
        preset: signs
      - type: note
        kind: warn
        text: >-
          Одного «половинчатого» условия **мало**. «Две стороны параллельны» — это ещё трапеция. «Две стороны равны» — у равнобедренной
          трапеции боковые стороны тоже равны. «Диагонали равны» — снова равнобедренная трапеция. «Диагонали перпендикулярны» — подойдёт
          «воздушный змей». Выбери на картинке «Мало условий» и убедись сам.
      - type: example
        title: 'Что гарантирует параллелограмм: «$AB=CD$ и $AC=BD$» или «$AB\parallel CD$ и $AB=CD$»?'
        steps:
          - 'В первом условии равна только одна пара сторон и ещё диагонали. Так бывает у равнобедренной трапеции: боковые стороны равны и диагонали равны, а параллелограммом она не является.'
          - 'Второе условие — признак 1: две стороны параллельны и равны.'
          - 'Ответ: гарантирует второе условие.'

  - id: s6
    title: 'Трапеция'
    blocks:
      - type: text
        text: >-
          Загляни в ведро сбоку: сверху оно шире, снизу уже, стенки наклонные. Или вспомни крышу-«скат». Такая фигура — **трапеция**.
          У неё всего **одна пара параллельных сторон**. Они называются **основаниями** ($AD$ и $BC$), а две другие стороны — **боковыми**
          ($AB$ и $CD$). Расстояние между основаниями — **высота**. Меняй размеры и смотри, как фигура сама называет себя.
      - type: viz
        id: trapezoid
      - type: note
        kind: tip
        text: >-
          Углы при одной боковой стороне — односторонние при параллельных основаниях, поэтому в сумме они дают $180^\circ$:
          $\angle A+\angle B=180^\circ$ и $\angle C+\angle D=180^\circ$.
      - type: note
        kind: tip
        text: >-
          **Равнобедренная** трапеция: боковые стороны равны ($AB=CD$). У неё равны углы при каждом основании ($\angle A=\angle D$,
          $\angle B=\angle C$) и равны диагонали ($AC=BD$).
      - type: note
        kind: tip
        text: >-
          **Прямоугольная** трапеция: одна боковая сторона перпендикулярна основаниям. У неё два прямых угла ($\angle A=\angle B=90^\circ$),
          а эта боковая сторона заодно и высота.
      - type: note
        kind: warn
        text: >-
          Боковые стороны трапеции **не параллельны**, иначе получился бы параллелограмм. А основания — это не обязательно «верх и низ»:
          основания — те стороны, которые параллельны, как бы ни лежала фигура.
      - type: example
        title: 'Угол $A$ трапеции $ABCD$ с основаниями $AD$ и $BC$ равен $50^\circ$. Найди угол $B$.'
        steps:
          - 'Углы $A$ и $B$ прилежат к боковой стороне $AB$, она пересекает параллельные основания.'
          - '$\angle B=180^\circ-50^\circ=130^\circ$.'
      - type: example
        title: 'В равнобедренной трапеции $AD=14$, $AB=4$, $\angle A=60^\circ$. Найди $BC$.'
        steps:
          - 'Опустим высоты $BH$ и $CK$ на основание $AD$. По краям получатся два одинаковых прямоугольных треугольника, а посередине прямоугольник $HBCK$, в нём $HK=BC$.'
          - 'В треугольнике $ABH$ угол $A=60^\circ$, поэтому $\angle ABH=30^\circ$. Катет против угла $30^\circ$ вдвое короче гипотенузы: $AH=AB:2=2$. Так же $KD=2$.'
          - '$BC=HK=AD-AH-KD=14-2-2=10$.'

  - id: s7
    title: 'Средняя линия трапеции'
    blocks:
      - type: text
        text: >-
          Возьми трапецию-лесенку и соедини серединки боковых сторон перекладиной. Эта перекладина — **средняя линия**. Она параллельна
          основаниям, а её длина — **среднее арифметическое** оснований. Например, у оснований $4$ и $10$ средняя линия равна $7$:
          ровно посередине между ними. Подвигай основания и проверь.
      - type: viz
        id: midline
      - type: note
        kind: tip
        text: >-
          **Средняя линия трапеции** — отрезок, соединяющий середины боковых сторон. Она параллельна основаниям и равна их полусумме.
      - type: math
        tex: 'm=\dfrac{a+b}{2}'
      - type: text
        text: >-
          Почему так? Достроим к трапеции такую же, но перевёрнутую: вместе получится параллелограмм с основанием $a+b$, а средняя линия
          окажется ровно его половиной. Нажми «Достроить» на картинке. А диагональ режет среднюю линию на два куска: каждый — средняя линия
          треугольника, то есть половина основания.
      - type: note
        kind: tip
        text: >-
          У **треугольника** тоже есть средняя линия: она соединяет середины двух сторон, параллельна третьей стороне и **вдвое короче** её.
      - type: note
        kind: warn
        text: >-
          Средняя линия длиннее меньшего основания, но короче большего. Если в ответе получилось число не между основаниями, ищи ошибку.
      - type: example
        title: 'Основания трапеции равны $6$ и $14$. Найди среднюю линию.'
        steps:
          - '$m=\dfrac{6+14}{2}=10$.'
          - 'Проверка: $10$ лежит между $6$ и $14$.'
      - type: example
        title: 'Средняя линия трапеции равна $9$, одно основание равно $12$. Найди другое основание.'
        steps:
          - 'Сумма оснований вдвое больше средней линии: $a+b=2\cdot 9=18$.'
          - 'Другое основание: $18-12=6$.'
      - type: example
        title: 'Диагональ делит среднюю линию трапеции на отрезки $3$ и $6$. Найди основания.'
        steps:
          - 'Каждый отрезок — средняя линия треугольника, то есть половина основания.'
          - 'Основания: $2\cdot 3=6$ и $2\cdot 6=12$. Проверка: $\dfrac{6+12}{2}=9=3+6$.'

  - id: s8
    title: '⭐ Площади параллелограмма и трапеции'
    blocks:
      - type: text
        text: >-
          Параллелограмм — это «перекошенный» прямоугольник. Возьми ножницы: отрежь слева уголок-треугольник по высоте и приставь его справа.
          Получился обычный прямоугольник, а у него площадь — длина на ширину. Нажми «Перекроить» на картинке.
      - type: viz
        id: areaCut
        preset: parallelogram
      - type: note
        kind: tip
        text: >-
          Площадь параллелограмма равна произведению основания на высоту, проведённую к этому основанию: $S=a\cdot h$.
      - type: note
        kind: warn
        text: >-
          **Высота** — это перпендикуляр между сторонами, а не боковая сторона. Площадь параллелограмма **не** равна произведению соседних
          сторон: наклонишь фигуру сильнее — стороны те же, а площадь меньше.
      - type: text
        text: >-
          Теперь трапеция. Приставь к ней вторую такую же, перевёрнутую. Получится параллелограмм с основанием $a+b$ и той же высотой $h$.
          Значит, площадь одной трапеции — половина.
      - type: viz
        id: areaCut
        preset: trapezoid
      - type: note
        kind: tip
        text: >-
          Площадь трапеции равна полусумме оснований, умноженной на высоту, то есть средней линии на высоту.
      - type: math
        tex: 'S=\dfrac{a+b}{2}\cdot h'
      - type: example
        title: 'В параллелограмме $AB=8$, $AD=9$, $\angle A=30^\circ$. Найди площадь.'
        steps:
          - 'Проведём высоту $BH$ к стороне $AD$. В прямоугольном треугольнике $ABH$ угол $A=30^\circ$.'
          - 'Катет против угла $30^\circ$ вдвое короче гипотенузы: $BH=AB:2=4$.'
          - '$S=AD\cdot BH=9\cdot 4=36$.'
      - type: example
        title: 'Основания равнобедренной трапеции равны $4$ и $10$, боковая сторона равна $5$. Найди площадь.'
        steps:
          - 'Опустим высоту $BH$ на большее основание: $AH=\dfrac{10-4}{2}=3$.'
          - 'Теорема Пифагора для прямоугольного треугольника $ABH$: $BH=\sqrt{5^2-3^2}=\sqrt{16}=4$.'
          - '$S=\dfrac{10+4}{2}\cdot 4=28$.'

