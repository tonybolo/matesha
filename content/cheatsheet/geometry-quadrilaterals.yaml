subject: geometry
# Шпаргалка к теме «Определения четырёхугольников» (определения как в учебнике Атанасяна, 8 класс).
sections:
  - title: 'Четырёхугольники: части и углы'
    items:
      - name: Периметр четырёхугольника — сумма длин сторон
        tex: 'P=AB+BC+CD+DA'
      - name: Диагонали соединяют противоположные вершины
        tex: 'AC,\ BD'
      - name: Сумма углов выпуклого четырёхугольника
        tex: '\angle A+\angle B+\angle C+\angle D=360^\circ'

  - title: 'Четырёхугольники: параллелограмм, прямоугольник, ромб, квадрат'
    items:
      - name: Параллелограмм — противоположные стороны попарно параллельны
        tex: 'AB\parallel CD,\quad BC\parallel AD'
      - name: Параллелограмм (бонус) — противоположные стороны равны
        tex: 'AB=CD,\quad BC=AD'
      - name: Параллелограмм (бонус) — противоположные углы равны, соседние дают 180°
        tex: '\angle A=\angle C,\quad \angle A+\angle B=180^\circ'
      - name: Прямоугольник — параллелограмм с прямыми углами
        tex: '\angle A=\angle B=\angle C=\angle D=90^\circ'
      - name: Ромб — параллелограмм с равными сторонами
        tex: 'AB=BC=CD=DA'
      - name: Квадрат — прямоугольник с равными сторонами (он же ромб)
        tex: 'AB=BC=CD=DA,\quad \angle A=90^\circ'

  - title: 'Четырёхугольники: трапеция'
    items:
      - name: Трапеция — основания параллельны, боковые стороны нет
        tex: 'AD\parallel BC,\quad AB\nparallel CD'
      - name: Равнобедренная трапеция — боковые стороны равны
        tex: 'AB=CD'
      - name: Прямоугольная трапеция — один из углов прямой (тогда прямых углов два)
        tex: '\angle A=\angle B=90^\circ'
      - name: Углы при боковой стороне трапеции (основания параллельны)
        tex: '\angle A+\angle B=180^\circ,\quad \angle C+\angle D=180^\circ'

  - title: 'Четырёхугольники: кто чей «родственник»'
    items:
      - name: Квадрат — это и прямоугольник, и ромб, и параллелограмм
        tex: '\text{квадрат}\to\text{прямоугольник}\to\text{параллелограмм}'
      - name: Ромб — параллелограмм, параллелограмм — четырёхугольник
        tex: '\text{ромб}\to\text{параллелограмм}\to\text{четырёхугольник}'
      - name: Параллелограмм не трапеция (у трапеции ровно одна пара параллельных сторон)
        tex: '1\ \text{пара}\ \parallel\ \to\ \text{трапеция},\quad 2\ \text{пары}\ \parallel\ \to\ \text{параллелограмм}'

  - title: 'Четырёхугольники: по координатам вершин'
    items:
      - name: «Шаг» стороны AB (на сколько вправо и вверх)
        tex: '\overrightarrow{AB}=(x_B-x_A;\ y_B-y_A)'
      - name: Квадрат длины стороны с шагом (a; b)
        tex: 'AB^2=a^2+b^2'
      - name: Стороны с шагами (a; b) и (c; d) перпендикулярны
        tex: 'a\cdot c+b\cdot d=0'
