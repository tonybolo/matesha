subject: algebra
# Тема 0 (повторение). У пунктов с lhs/rhs тесты проверяют равенство числами (запись для компьютера).
sections:
  - title: Числа со знаками
    items:
      - name: 'Одинаковые знаки: складываем модули, знак общий'
        tex: '-3+(-5)=-(3+5)=-8'
        lhs: '-3+(-5)'
        rhs: '-8'
      - name: 'Разные знаки: из большего модуля вычитаем меньший, знак — как у числа с большим модулем'
        tex: '-8+5=-(8-5)=-3'
        lhs: '-8+5'
        rhs: '-3'
      - name: 'Сумма противоположных чисел'
        tex: 'a+(-a)=0'
        lhs: 'a+(-a)'
        rhs: '0'
      - name: 'Вычитание — прибавление противоположного'
        tex: 'a-b=a+(-b)'
        lhs: 'a-b'
        rhs: 'a+(-b)'
      - name: 'Вычесть отрицательное — прибавить положительное'
        tex: 'a-(-b)=a+b'
        lhs: 'a-(-b)'
        rhs: 'a+b'
      - name: 'Минус перед скобкой (сумма)'
        tex: '-(a+b)=-a-b'
        lhs: '-(a+b)'
        rhs: '-a-b'
      - name: 'Минус перед скобкой (разность)'
        tex: '-(a-b)=-a+b'
        lhs: '-(a-b)'
        rhs: '-a+b'
      - name: 'Модуль — расстояние от нуля'
        tex: '|a|=a\ \text{при}\ a\ge 0,\qquad |a|=-a\ \text{при}\ a<0'
      - name: 'Модуль противоположного числа'
        tex: '\left|-a\right|=|a|'
        lhs: 'abs(-a)'
        rhs: 'abs(a)'
      - name: 'Расстояние между точками a и b'
        tex: 'AB=|a-b|=|b-a|'
        lhs: 'abs(a-b)'
        rhs: 'abs(b-a)'
      - name: 'Смешанное число со знаком'
        tex: '-2\frac{1}{3}=-\left(2+\frac{1}{3}\right)=-\frac{7}{3}'
        lhs: '-(2+1/3)'
        rhs: '-7/3'
