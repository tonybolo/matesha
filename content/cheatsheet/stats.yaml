subject: stats
# Шпаргалка по вероятности и статистике. Переменных-чисел здесь нет, поэтому lhs/rhs не нужны.
sections:
  - title: Набор чисел
    items:
      - name: Среднее арифметическое
        tex: '\bar{x}=\dfrac{x_1+x_2+\ldots+x_n}{n}'
      - name: Отклонение числа от среднего
        tex: 'x_i-\bar{x}'
      - name: Сумма отклонений от среднего всегда равна нулю
        tex: '(x_1-\bar{x})+\ldots+(x_n-\bar{x})=0'
      - name: Дисперсия — среднее квадратов отклонений
        tex: 'D=\dfrac{(x_1-\bar{x})^2+\ldots+(x_n-\bar{x})^2}{n}'
      - name: Стандартное отклонение (в тех же единицах, что и данные)
        tex: '\sigma=\sqrt{D}'

  - title: Случайная величина
    items:
      - name: Сумма вероятностей в таблице распределения
        tex: 'p_1+p_2+\ldots+p_n=1'
      - name: Математическое ожидание — средний результат за много опытов
        tex: 'E(X)=x_1p_1+x_2p_2+\ldots+x_np_n'
      - name: Дисперсия случайной величины
        tex: 'D(X)=(x_1-E)^2p_1+\ldots+(x_n-E)^2p_n'
      - name: 'Удобная формула: среднее квадратов минус квадрат среднего'
        tex: 'D(X)=E(X^2)-\big(E(X)\big)^2'
      - name: Стандартное отклонение
        tex: '\sigma(X)=\sqrt{D(X)}'
      - name: 'Справедливая игра: цена участия равна ожидаемому выигрышу'
        tex: 'C=E(X)'
      - name: Игральный кубик
        tex: 'E=3{,}5,\quad D=\dfrac{35}{12}'

  - title: Свойства E и D
    items:
      - name: Сдвиг и растяжение
        tex: 'E(aX+b)=a\cdot E(X)+b'
      - name: Сдвиг не меняет разброс, множитель выходит в квадрате
        tex: 'D(aX+b)=a^2\cdot D(X)'
      - name: Стандартное отклонение растягивается в |a| раз
        tex: '\sigma(aX+b)=|a|\cdot\sigma(X)'
      - name: Ожидание суммы — всегда
        tex: 'E(X+Y)=E(X)+E(Y)'
      - name: Дисперсия суммы — для независимых величин
        tex: 'D(X+Y)=D(X)+D(Y)'
