subject: geometry
# Шпаргалка по теме «Параллелограмм, трапеция». У пунктов с lhs/rhs тесты проверяют равенство числами.
sections:
  - title: 'Параллелограмм: свойства'
    items:
      - name: 'Противоположные стороны равны'
        tex: 'AB=CD,\quad BC=AD'
      - name: 'Противоположные углы равны'
        tex: '\angle A=\angle C,\quad \angle B=\angle D'
      - name: 'Соседние углы в сумме 180°'
        tex: '\angle A+\angle B=180^\circ'
        lhs: 'x+(180-x)'
        rhs: '180'
      - name: 'Сумма углов параллелограмма'
        tex: '\angle A+\angle B+\angle C+\angle D=360^\circ'
        lhs: '2*x+2*(180-x)'
        rhs: '360'
      - name: 'Диагонали делятся пополам'
        tex: 'AO=OC=\dfrac{AC}{2},\quad BO=OD=\dfrac{BD}{2}'
      - name: 'Периметр'
        tex: 'P=2(a+b)'
        lhs: 'a+b+a+b'
        rhs: '2*(a+b)'
      - name: 'Биссектриса угла A отсекает равнобедренный треугольник'
        tex: 'BM=AB'
      - name: 'Биссектриса угла D отсекает равнобедренный треугольник'
        tex: 'CK=CD'

  - title: 'Параллелограмм: признаки'
    items:
      - name: 'Признак 1 — две стороны равны и параллельны'
        tex: 'AB\parallel CD,\quad AB=CD'
      - name: 'Признак 2 — противоположные стороны попарно равны'
        tex: 'AB=CD,\quad BC=AD'
      - name: 'Признак 3 — диагонали делятся пополам'
        tex: 'AO=OC,\quad BO=OD'

  - title: 'Трапеция'
    items:
      - name: 'Основания параллельны, боковые стороны нет'
        tex: 'AD\parallel BC,\quad AB\nparallel CD'
      - name: 'Углы при боковой стороне в сумме 180°'
        tex: '\angle A+\angle B=180^\circ,\quad \angle C+\angle D=180^\circ'
      - name: 'Равнобедренная трапеция'
        tex: 'AB=CD,\quad \angle A=\angle D,\quad AC=BD'
      - name: 'Прямоугольная трапеция'
        tex: '\angle A=\angle B=90^\circ'
      - name: 'Средняя линия трапеции'
        tex: 'm=\dfrac{a+b}{2}'
      - name: 'Сумма оснований — удвоенная средняя линия'
        tex: 'a+b=2m'
        lhs: 'a+b'
        rhs: '2*((a+b)/2)'
      - name: 'Диагональ делит среднюю линию на половинки оснований'
        tex: 'MP=\dfrac{b}{2},\quad PN=\dfrac{a}{2}'
        lhs: 'b/2+a/2'
        rhs: '(a+b)/2'
      - name: 'Средняя линия треугольника'
        tex: 'MN=\dfrac{AC}{2},\quad MN\parallel AC'

  - title: 'Площади и прямоугольный треугольник'
    items:
      - name: 'Площадь параллелограмма'
        tex: 'S=a\cdot h'
      - name: 'Площадь трапеции'
        tex: 'S=\dfrac{a+b}{2}\cdot h'
        lhs: '(a+b)/2*h'
        rhs: '(a+b)*h/2'
      - name: 'Площадь трапеции через среднюю линию'
        tex: 'S=m\cdot h'
      - name: 'Диагональ делит параллелограмм на две равные части'
        tex: 'S_{ABD}=\dfrac{S}{2}'
      - name: 'Катет против угла 30°'
        tex: 'BH=\dfrac{AB}{2}\ \ (\angle A=30^\circ)'
      - name: 'Теорема Пифагора'
        tex: 'c^2=a^2+b^2'
