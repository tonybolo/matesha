id: 'st-01-expectation-variance'
subject: stats
order: 1
title: 'Математическое ожидание. Дисперсия'
summary: 'Среднее и разброс набора чисел, дисперсия и стандартное отклонение; случайная величина, математическое ожидание («средний выигрыш») и справедливая игра.'
passScore: 5

steps:
  - id: s1
    title: 'Среднее — точка равновесия'
    blocks:
      - type: text
        text: >-
          Пятеро друзей собирали яблоки: 2, 3, 3, 5 и 7 кг. Ссыпаем всё в одну кучу — получилось 20 кг — и делим
          поровну: каждому по 4 кг. Число 4 и есть **среднее арифметическое**: сумма всех чисел, делённая на их количество.
      - type: text
        text: >-
          А теперь фокус. Положим на линейку одинаковые грузики в точках 2, 3, 3, 5 и 7. Где подставить палец, чтобы
          линейка не упала? Ровно под точкой 4 — под средним! Двигай грузики кнопками «−» и «+» и смотри, куда переезжает опора.
          А потом попробуй поставить опору сам.
      - type: viz
        id: balance
      - type: note
        kind: tip
        text: >-
          **Среднее арифметическое** $\bar{x}$ («икс с чертой») — сумма чисел, делённая на их количество. Это точка,
          в которой набор «уравновешен»: опору нужно ставить именно туда.
      - type: math
        tex: '\bar{x}=\dfrac{x_1+x_2+\ldots+x_n}{n}'
      - type: note
        kind: warn
        text: >-
          Делим на **количество** чисел. Если число повторяется (3 и 3), оно считается столько раз, сколько встречается:
          это два грузика, а не один.
      - type: example
        title: 'Оценки Маши за неделю: $5$; $4$; $5$; $3$; $5$; $2$. Найди средний балл.'
        steps:
          - 'Сумма: $5+4+5+3+5+2=24$.'
          - 'Оценок $6$, поэтому среднее $24:6=4$.'
          - 'Смысл: если бы все шесть оценок были одинаковыми при той же сумме, все они были бы четвёрками.'

  - id: s2
    title: 'Одно среднее — разный разброс'
    blocks:
      - type: text
        text: >-
          Петя и Вася четыре дня решали задачи. Петя: 5, 5, 5, 5. Вася: 1, 3, 7, 9. Посчитай: у обоих в среднем по 5 задач
          в день! Но Петя работает ровно, а Вася то отдыхает, то рвётся вперёд. Среднее одинаковое, а наборы совсем разные.
      - type: viz
        id: balance
        preset: two
      - type: text
        text: >-
          Значит, одного среднего мало. Нужна ещё **мера разброса** — число, которое показывает, насколько далеко числа
          разбегаются от среднего. Ты знаешь **размах** (наибольшее число минус наименьшее), но он смотрит только на два
          крайних числа. Сейчас придумаем меру, которая учитывает все числа сразу.
      - type: note
        kind: tip
        text: >-
          Среднее говорит, **где** центр набора. Мера разброса говорит, **насколько плотно** числа собрались вокруг этого центра.
      - type: example
        title: 'Температура в двух городах три дня подряд: в Тихом $14$°, $15$°, $16$°, в Ветреном $5$°, $15$°, $25$°.'
        steps:
          - 'Средние: $(14+15+16):3=15$ и $(5+15+25):3=15$ — одинаковые.'
          - 'Но в Тихом каждый день почти одно и то же, а в Ветреном то холодно, то жарко.'
          - 'Разброс в Ветреном намного больше: собираясь туда, бери и куртку, и шорты.'

  - id: s3
    title: 'Отклонения и дисперсия'
    blocks:
      - type: text
        text: >-
          **Отклонение** показывает, на сколько число отошло от среднего: отклонение = число − среднее. У Васи
          (1, 3, 7, 9, среднее 5) отклонения такие: $1-5=-4$, $3-5=-2$, $7-5=2$, $9-5=4$. Минус значит «левее среднего»,
          плюс — «правее».
      - type: text
        text: >-
          Хочется сложить отклонения — вот и мера разброса. Но сумма отклонений от среднего **всегда равна нулю**:
          $-4-2+2+4=0$. Помнишь линейку? Опора стоит в среднем именно потому, что «перевес» слева и справа одинаковый:
          минусы съедают плюсы.
      - type: text
        text: >-
          Чтобы минусы не мешали, возведём каждое отклонение в квадрат (квадрат не бывает отрицательным): $16$, $4$, $4$, $16$.
          И найдём среднее этих квадратов: $(16+4+4+16):4=10$. Это и есть **дисперсия** — мера разброса. Двигай точки и смотри,
          как меняются квадраты и дисперсия.
      - type: viz
        id: spread
      - type: note
        kind: tip
        text: >-
          **Дисперсия** $D$ — среднее арифметическое квадратов отклонений от среднего. Четыре шага: 1) среднее;
          2) отклонения; 3) квадраты отклонений; 4) среднее квадратов.
      - type: math
        tex: 'D=\dfrac{(x_1-\bar{x})^2+\ldots+(x_n-\bar{x})^2}{n}'
      - type: note
        kind: warn
        text: >-
          Сумму квадратов делим на **количество чисел** $n$. Квадрат отрицательного числа положителен: $(-4)^2=16$.
          Если все числа одинаковые, все отклонения равны нулю и $D=0$ — разброса нет.
      - type: example
        title: 'Найди дисперсию набора $2$; $4$; $4$; $6$.'
        steps:
          - 'Среднее: $(2+4+4+6):4=4$.'
          - 'Отклонения: $-2$; $0$; $0$; $2$ (сумма $0$ ✓).'
          - 'Квадраты отклонений: $4$; $0$; $0$; $4$.'
          - 'Дисперсия: $(4+0+0+4):4=2$.'

  - id: s4
    title: 'Стандартное отклонение'
    blocks:
      - type: text
        text: >-
          У дисперсии есть неудобство. Если числа — это сантиметры, то квадраты отклонений — «квадратные сантиметры», и
          дисперсия тоже получается в см². Сравнивать её с самими данными неудобно. Поэтому из дисперсии извлекают квадратный корень.
      - type: note
        kind: tip
        text: >-
          **Стандартное отклонение** $\sigma=\sqrt{D}$ ($\sigma$ — греческая буква «сигма»). Оно измеряется в тех же
          единицах, что и данные, и показывает обычное расстояние чисел от среднего.
      - type: viz
        id: spread
        preset: sigma
      - type: text
        text: >-
          На картинке дисперсия — это площадь «среднего» квадрата, а $\sigma$ — его сторона. Полоса от $\bar{x}-\sigma$
          до $\bar{x}+\sigma$ показывает типичный разброс: чем она шире, тем сильнее числа разбегаются от среднего.
      - type: example
        title: 'Рост четырёх ребят: $148$; $154$; $156$; $162$ см. Найди $D$ и $\sigma$.'
        steps:
          - 'Среднее: $(148+154+156+162):4=155$ см.'
          - 'Отклонения: $-7$; $-1$; $1$; $7$, их квадраты: $49$; $1$; $1$; $49$.'
          - 'Дисперсия: $D=(49+1+1+49):4=25$ (в см²).'
          - 'Стандартное отклонение: $\sigma=\sqrt{25}=5$ см. Рост ребят обычно отличается от среднего примерно на $5$ см.'
      - type: note
        kind: warn
        text: 'Стандартное отклонение — это корень из дисперсии, а не её половина. Если $D=16$, то $\sigma=4$, а не $8$.'

  - id: s5
    title: 'Случайная величина и её таблица'
    blocks:
      - type: text
        text: >-
          Бросаем кубик. Сколько выпадет очков, заранее неизвестно: может 1, а может 6. Число, которое зависит от случая,
          называют **случайной величиной** и обозначают большой буквой, например $X$.
      - type: text
        text: >-
          Про случайную величину важно знать две вещи: какие значения она может принять и с какими вероятностями. Их
          записывают в **таблицу распределения**: в верхней строке значения, в нижней — их вероятности. У кубика каждое из
          шести значений выпадает с вероятностью $\frac{1}{6}$:
      - type: math
        tex: '\begin{array}{c|cccccc} X & 1 & 2 & 3 & 4 & 5 & 6 \cr \hline P & \frac{1}{6} & \frac{1}{6} & \frac{1}{6} & \frac{1}{6} & \frac{1}{6} & \frac{1}{6} \end{array}'
      - type: viz
        id: distribution
      - type: note
        kind: tip
        text: >-
          Сумма всех вероятностей в таблице всегда равна $1$: какое-то значение обязательно выпадет. Поэтому одну неизвестную
          вероятность легко найти: из $1$ вычитаем сумму остальных.
      - type: example
        title: 'Найди $p$: $X$ принимает значения $0$; $1$; $2$ с вероятностями $0{,}3$; $p$; $0{,}2$.'
        steps:
          - 'Сумма вероятностей равна $1$: $0{,}3+p+0{,}2=1$.'
          - '$p=1-(0{,}3+0{,}2)=1-0{,}5=0{,}5$.'
      - type: note
        kind: warn
        text: >-
          Вероятность не бывает отрицательной и не бывает больше $1$. Если вышло $p=-0{,}2$, где-то ошибка (или такой
          таблицы не бывает).

  - id: s6
    title: 'Математическое ожидание: средний выигрыш'
    blocks:
      - type: text
        text: >-
          Вася бросает кубик и получает столько конфет, сколько выпало очков. Сколько конфет он будет получать **в среднем**,
          если сыграет много-много раз? За $600$ бросков каждое число выпадет примерно по $100$ раз, и конфет наберётся
          примерно $100\cdot(1+2+3+4+5+6)=2100$. Делим на $600$ бросков: в среднем по $3{,}5$ конфеты за бросок.
      - type: text
        text: >-
          Это число называют **математическим ожиданием** $E(X)$ — средним значением случайной величины в длинной серии
          опытов. Считают его так: каждое значение умножают на его вероятность и всё складывают.
      - type: math
        tex: 'E(X)=x_1p_1+x_2p_2+\ldots+x_np_n'
      - type: viz
        id: dice
      - type: note
        kind: tip
        text: >-
          Для кубика $E(X)=1\cdot\frac{1}{6}+2\cdot\frac{1}{6}+\ldots+6\cdot\frac{1}{6}=\frac{21}{6}=3{,}5$. Само число $3{,}5$
          на кубике никогда не выпадает, но среднее за много бросков подбирается к нему всё ближе. Это **закон больших чисел**.
      - type: text
        text: >-
          Математическое ожидание помогает понять, честная ли игра. Игра **справедливая**, если цена участия равна
          математическому ожиданию выигрыша: тогда в среднем никто не остаётся ни в выигрыше, ни в проигрыше.
      - type: viz
        id: game
      - type: example
        title: 'Лотерея: $100$ билетов, $1$ выигрыш $500$ руб. и $5$ выигрышей по $100$ руб., остальные билеты пустые. Какая цена билета справедлива?'
        steps:
          - 'Выигрыш $X$ принимает значения $500$; $100$; $0$ с вероятностями $0{,}01$; $0{,}05$; $0{,}94$.'
          - '$E(X)=500\cdot 0{,}01+100\cdot 0{,}05+0\cdot 0{,}94=5+5=10$ руб.'
          - 'Проверим «на пальцах»: все призы вместе — $500+5\cdot 100=1000$ руб. на $100$ билетов, по $10$ руб. на билет.'
          - 'Справедливая цена — $10$ руб. Если билет стоит $15$ руб., игрок в среднем теряет $5$ руб. с каждого билета.'
      - type: note
        kind: warn
        text: 'Математическое ожидание — это среднее за **много** игр. В одной игре ты получишь не $10$ руб., а $0$, $100$ или $500$.'

  - id: s7
    title: 'Дисперсия случайной величины'
    blocks:
      - type: text
        text: >-
          В игре А ты всегда получаешь $5$ очков. В игре Б бросают монету: $0$ или $10$ очков. Математическое ожидание у обеих
          игр $5$, но в игре Б выигрыш «скачет». Разброс случайной величины тоже измеряют **дисперсией**.
      - type: text
        text: >-
          Всё как у набора чисел: вместо среднего берём $E=E(X)$, а квадраты отклонений усредняем **с вероятностями**:
      - type: math
        tex: 'D(X)=(x_1-E)^2p_1+\ldots+(x_n-E)^2p_n'
      - type: viz
        id: distribution
        preset: var
      - type: note
        kind: tip
        text: >-
          Удобная формула: $D(X)=E(X^2)-\big(E(X)\big)^2$ — «среднее квадратов минус квадрат среднего». Стандартное
          отклонение, как и раньше, $\sigma(X)=\sqrt{D(X)}$.
      - type: example
        title: 'Игра Б: $X=0$ или $X=10$ с вероятностями $0{,}5$ и $0{,}5$. Найди $D(X)$ и $\sigma(X)$.'
        steps:
          - '$E(X)=0\cdot 0{,}5+10\cdot 0{,}5=5$.'
          - 'Отклонения: $0-5=-5$ и $10-5=5$, их квадраты $25$ и $25$.'
          - '$D(X)=25\cdot 0{,}5+25\cdot 0{,}5=25$, $\sigma(X)=\sqrt{25}=5$. А у игры А $D=0$: разброса нет.'
      - type: example
        title: 'Кубик: найди $D(X)$.'
        steps:
          - '$E(X)=3{,}5$ — это мы уже знаем.'
          - 'Квадраты значений: $1$; $4$; $9$; $16$; $25$; $36$, поэтому $E(X^2)=\frac{1+4+9+16+25+36}{6}=\frac{91}{6}$.'
          - '$D(X)=\frac{91}{6}-3{,}5^2=\frac{91}{6}-\frac{49}{4}=\frac{182-147}{12}=\frac{35}{12}$.'
          - '$\sigma(X)=\sqrt{\frac{35}{12}}\approx 1{,}71$: обычно выпавшее число отличается от $3{,}5$ примерно на $1{,}7$.'

  - id: s8
    title: '⭐ Свойства: сдвиг, растяжение, сумма'
    blocks:
      - type: text
        text: >-
          Представь, что к каждому выигрышу в игре добавляют подарок — $3$ очка. Средний выигрыш вырастет на $3$, а разброс не
          изменится: вся таблица просто сдвинулась. А если все выигрыши удвоить, среднее удвоится, все отклонения тоже удвоятся,
          а их квадраты станут в $4$ раза больше.
      - type: viz
        id: distribution
        preset: lin
      - type: math
        tex: 'E(aX+b)=a\cdot E(X)+b'
      - type: math
        tex: 'D(aX+b)=a^2\cdot D(X)'
      - type: note
        kind: tip
        text: >-
          Прибавили число $b$ — $E$ сдвинулось на $b$, а $D$ не изменилась. Умножили на $a$ — $E$ умножилось на $a$,
          $D$ — на $a^2$, а $\sigma$ — на $|a|$.
      - type: text
        text: >-
          Для двух случайных величин $E(X+Y)=E(X)+E(Y)$ — всегда. А дисперсии складываются, если величины **независимы**
          (одна никак не влияет на другую, например очки на двух разных кубиках): $D(X+Y)=D(X)+D(Y)$.
      - type: example
        title: 'Бросаем два кубика. Найди $E$ и $D$ суммы очков.'
        steps:
          - 'Для одного кубика $E=3{,}5$ и $D=\frac{35}{12}$.'
          - '$E(X+Y)=3{,}5+3{,}5=7$.'
          - 'Кубики независимы: $D(X+Y)=\frac{35}{12}+\frac{35}{12}=\frac{35}{6}$.'
      - type: note
        kind: warn
        text: >-
          Подвох: для независимых величин и $D(X-Y)=D(X)+D(Y)$ — от вычитания разброс не уменьшается! А вот
          $D(X+X)=D(2X)=4D(X)$, потому что $X$ и $X$ совсем не независимы.

check:
  - id: q1
    kind: choice
    step: 0
    prompt: 'Одинаковые грузики лежат на линейке в точках $1$, $2$ и $6$. Где поставить опору, чтобы линейка не наклонилась?'
    options:
      - 'В точке $3$'
      - 'В точке $2$ — у среднего по счёту грузика'
      - 'В точке $3{,}5$ — посередине между $1$ и $6$'
      - 'В точке $6$ — под самым дальним грузиком'
    correct: 0
    explain: 'Опору ставим в среднее: $(1+2+6):3=3$. Слева от неё расстояния $2+1=3$, справа $3$ — поровну.'
  - id: q2
    kind: choice
    step: 1
    prompt: 'Петя четыре дня решал по $5$; $5$; $5$; $5$ задач, а Вася — по $1$; $3$; $7$; $9$. Что верно?'
    options:
      - 'Среднее у них одинаковое, но у Васи разброс (дисперсия) больше'
      - 'Раз среднее одинаковое, то и разброс одинаковый'
      - 'У Пети разброс больше: у него больше одинаковых чисел'
      - 'У Васи среднее больше, потому что у него есть число $9$'
    correct: 0
    explain: 'Среднее у обоих $5$. У Пети все отклонения нулевые ($D=0$), у Васи числа отходят от $5$ на $4$ и $2$: $D=10$.'
  - id: q3
    kind: input
    step: 2
    prompt: 'Найди дисперсию набора $2$; $4$; $6$; $8$ (дисперсия — среднее арифметическое квадратов отклонений от среднего).'
    answerKind: expr
    answer: '5'
    placeholder: 'число, например 7 или 2,5'
    explain: 'Среднее $5$; отклонения $-3$; $-1$; $1$; $3$; квадраты $9$; $1$; $1$; $9$; $D=(9+1+1+9):4=5$.'
  - id: q4
    kind: input
    step: 4
    prompt: 'Случайная величина $X$ принимает значения $0$; $1$; $2$; $3$ с вероятностями $0{,}1$; $0{,}3$; $p$; $0{,}2$. Найди $p$.'
    fig: {id: dist, props: {xs: ['0', '1', '2', '3'], ps: ['0.1', '0.3', 'p', '0.2']}}
    answerKind: expr
    answer: '0.4'
    placeholder: 'число, например 0,25'
    explain: 'Сумма вероятностей равна $1$: $p=1-(0{,}1+0{,}3+0{,}2)=1-0{,}6=0{,}4$.'
  - id: q5
    kind: input
    step: 5
    prompt: 'Случайная величина $X$ принимает значения $-1$; $2$; $5$ с вероятностями $0{,}3$; $0{,}5$; $0{,}2$. Найди $E(X)$.'
    fig: {id: dist, props: {xs: ['-1', '2', '5'], ps: ['0.3', '0.5', '0.2']}}
    answerKind: expr
    answer: '1.7'
    placeholder: 'число, например 2,5'
    explain: '$E(X)=(-1)\cdot 0{,}3+2\cdot 0{,}5+5\cdot 0{,}2=-0{,}3+1+1=1{,}7$.'
  - id: q6
    kind: input
    step: 5
    prompt: 'В лотерее $200$ билетов: $1$ выигрыш $1000$ руб. и $4$ выигрыша по $250$ руб., остальные билеты пустые. При какой цене билета игра будет справедливой?'
    answerKind: expr
    answer: '10'
    placeholder: 'цена в рублях'
    explain: 'Все призы вместе: $1000+4\cdot 250=2000$ руб. на $200$ билетов, то есть $E(X)=2000:200=10$ руб. Справедливая цена равна $E(X)$.'
  - id: q7
    kind: input
    step: 6
